name: Codex Product and Release

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [agent_codex_release]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  product-plan:
    if: >
      github.event_name == 'issues' &&
      github.event.label.name == 'agent:codex' &&
      contains(github.event.issue.labels.*.name, 'phase:product-plan') &&
      contains(github.event.issue.labels.*.name, 'status:todo')
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require automation token
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: test -n "$GH_TOKEN"

      - name: Mark product planning running
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --remove-label "status:todo"             --add-label "status:running"

      - name: Build product prompt
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          {
            cat agents/codex_prompt.md
            echo
            echo "## Current task"
            echo "Task ID: GH-ISSUE-$ISSUE_NUMBER"
            echo "Issue: $ISSUE_TITLE"
            echo
            printf '%s\n' "$ISSUE_BODY"
          } > "$RUNNER_TEMP/codex-product.md"

      - name: Create task branch
        id: branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="agent/codex/issue-$ISSUE_NUMBER-${{ github.run_id }}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run Codex product manager
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-luna
          effort: max
          permission-profile: ":workspace"
          prompt-file: ${{ runner.temp }}/codex-product.md
          output-file: ${{ runner.temp }}/codex-product-output.md

      - name: Validate product-only changes
        if: steps.codex.outcome == 'success'
        id: changed
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u > "$RUNNER_TEMP/changed.txt"

          test -s "$RUNNER_TEMP/changed.txt"

          ALLOWED='^(docs/PRD\.md|docs/RECRUITMENT_RULES\.md|docs/DATA_COLLECTION_PLAN\.md|docs/CLASSIFICATION_DICTIONARY\.md|TASKS\.md|CHANGELOG\.md)$'
          if grep -Ev "$ALLOWED" "$RUNNER_TEMP/changed.txt"; then
            echo "Codex changed files outside the product-planning allowlist."
            exit 1
          fi

          echo "value=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push product plan
        if: steps.codex.outcome == 'success' && steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          gh auth setup-git
          git config user.name "codex-product-agent"
          git config user.email "codex-product-agent@users.noreply.github.com"
          git add -A
          git commit -m "docs: Codex product plan"
          git push origin "HEAD:$BRANCH"

      - name: Create specification PR, handoff and dispatch WorkBuddy
        if: steps.codex.outcome == 'success' && steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          TASK_ID="GH-ISSUE-$ISSUE_NUMBER"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          <!-- agent-task-id:$TASK_ID -->

          Codex product-planning output for issue #$ISSUE_NUMBER.

          Next owner: WorkBuddy prototype/data/classification validation.

          Closes #$ISSUE_NUMBER
          EOF

          PR_URL="$(gh pr create             --repo "${{ github.repository }}"             --base main             --head "$BRANCH"             --title "spec: $ISSUE_TITLE"             --body-file "$RUNNER_TEMP/pr-body.md")"
          PR_NUMBER="${PR_URL##*/}"
          SHA="$(git rev-parse HEAD)"

          export TASK_ID PR_NUMBER BRANCH SHA
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              "version":"1.0",
              "task_id":os.environ["TASK_ID"],
              "from_agent":"codex",
              "to_agent":"workbuddy",
              "phase":"product_planning",
              "status":"success",
              "summary":"Product and recruitment-business specification completed.",
              "model":"gpt-5.6-luna",
              "effort":"max",
              "required_inputs":["source issue","public repository"],
              "expected_outputs":[
                  "reports/prototype_review.md",
                  "reports/data_analysis.md",
                  "reports/classification_validation.md",
                  "reports/uiux_prototype.md"
              ],
              "acceptance":["WorkBuddy must validate implementability before ChatGPT development"],
              "artifacts":[
                  "docs/PRD.md",
                  "docs/RECRUITMENT_RULES.md",
                  "docs/DATA_COLLECTION_PLAN.md",
                  "docs/CLASSIFICATION_DICTIONARY.md",
                  "TASKS.md",
                  "CHANGELOG.md"
              ],
              "checks":[],
              "blockers":[],
              "source_ref":os.environ["BRANCH"],
              "source_sha":os.environ["SHA"],
              "pr_number":int(os.environ["PR_NUMBER"]),
          }
          body="<!-- agent-handoff:v1 -->\n### Agent handoff: codex → workbuddy\n\n```json\n"+json.dumps(payload,ensure_ascii=False,indent=2)+"\n```\n"
          Path(os.environ["RUNNER_TEMP"],"handoff.md").write_text(body)
          PY

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"             --body-file "$RUNNER_TEMP/handoff.md"

          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --add-label "phase:prototype"             --add-label "status:todo"             --add-label "agent:workbuddy"

          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --remove-label "agent:codex"             --remove-label "phase:product-plan"             --remove-label "status:running"             --add-label "status:review" || true

          jq -n             --argjson pr_number "$PR_NUMBER"             --arg task_id "$TASK_ID"             --arg head_ref "$BRANCH"             --arg source_sha "$SHA"             '{
              event_type:"agent_workbuddy_prototype",
              client_payload:{
                pr_number:$pr_number,
                task_id:$task_id,
                head_ref:$head_ref,
                source_sha:$source_sha,
                phase:"prototype"
              }
            }' | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -

      - name: Block failed product planning
        if: steps.codex.outcome != 'success' || steps.changed.outputs.value != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --remove-label "status:running"             --add-label "status:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --body "Codex product-planning failed or produced invalid output. No WorkBuddy handoff was dispatched."
          exit 1

  release-review:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Require automation token and resolve PR context
        id: context
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          TASK_ID_HINT: ${{ github.event.client_payload.task_id }}
          SOURCE_SHA_HINT: ${{ github.event.client_payload.source_sha }}
        run: |
          test -n "$GH_TOKEN"
          test -n "$PR_NUMBER"

          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"

          HEAD_REF="$(jq -r '.head.ref' "$RUNNER_TEMP/pr.json")"
          SOURCE_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          BODY="$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")"
          LABELS="$(jq -r '.labels[].name' "$RUNNER_TEMP/pr.json")"
          TASK_ID="$(printf '%s' "$BODY" | sed -n 's/.*<!-- agent-task-id:\([A-Za-z0-9._:-]*\) -->.*/\1/p' | head -n1)"

          test -n "$TASK_ID"
          echo "$LABELS" | grep -qx "agent:codex"
          echo "$LABELS" | grep -qx "phase:release"
          echo "$LABELS" | grep -qx "status:todo"

          if [ -n "$TASK_ID_HINT" ] && [ "$TASK_ID_HINT" != "$TASK_ID" ]; then
            exit 1
          fi
          if [ -n "$SOURCE_SHA_HINT" ] && [ "$SOURCE_SHA_HINT" != "$SOURCE_SHA" ]; then
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect and validate WorkBuddy QA handoff
        id: handoff_gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          TASK_ID: ${{ steps.context.outputs.task_id }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100"             --paginate > "$RUNNER_TEMP/comments.json"

          PYTHONPATH=. python scripts/validate_handoff.py             --comments "$RUNNER_TEMP/comments.json"             --task-id "$TASK_ID"             --from-agent workbuddy             --to-agent codex             --phase qa_acceptance             --source-sha "$SOURCE_SHA"

          jq -r '.[] | select(.body | contains("<!-- agent-handoff:v1 -->")) | .body'             "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/handoffs.md"

      - name: Block invalid release handoff gate
        if: steps.handoff_gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --remove-label "status:todo"             --add-label "status:blocked" || true
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"             --body "Codex release review was not started because the required successful WorkBuddy QA handoff was invalid."
          exit 1

      - name: Mark release review running
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --remove-label "status:todo"             --add-label "status:running"

      - name: Build release prompt
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          TASK_ID: ${{ steps.context.outputs.task_id }}
        run: |
          {
            cat agents/codex_prompt.md
            echo
            echo "## Release-review target"
            echo "Task ID: $TASK_ID"
            echo "PR #$PR_NUMBER"
            echo
            echo "## Prior handoffs"
            cat "$RUNNER_TEMP/handoffs.md"
          } > "$RUNNER_TEMP/codex-release.md"

      - name: Run Codex release review
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-luna
          effort: max
          permission-profile: ":workspace"
          prompt-file: ${{ runner.temp }}/codex-release.md
          output-file: ${{ runner.temp }}/codex-release-output.md

      - name: Validate release-only changes
        if: steps.codex.outcome == 'success'
        id: release_files
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u > "$RUNNER_TEMP/changed.txt"

          ALLOWED='^(CHANGELOG\.md|docs/RELEASE_NOTES\.md|reports/release_gate\.json)$'
          if grep -Ev "$ALLOWED" "$RUNNER_TEMP/changed.txt"; then
            echo "Codex changed files outside the release-review allowlist."
            exit 1
          fi

          test -f reports/release_gate.json
          python -m json.tool reports/release_gate.json >/dev/null
          echo "value=true" >> "$GITHUB_OUTPUT"

      - name: Commit release documents
        if: steps.codex.outcome == 'success' && steps.release_files.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
        run: |
          gh auth setup-git
          git config user.name "codex-release-agent"
          git config user.email "codex-release-agent@users.noreply.github.com"
          git add CHANGELOG.md docs/RELEASE_NOTES.md reports/release_gate.json
          git commit -m "docs: Codex release review" || true
          git push origin "HEAD:$HEAD_REF"

      - name: Apply release gate and dispatch WorkBuddy deployment
        if: steps.codex.outcome == 'success' && steps.release_files.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          TASK_ID: ${{ steps.context.outputs.task_id }}
        run: |
          STATUS="$(python - <<'PY'
          import json
          print(json.load(open("reports/release_gate.json"))["status"])
          PY
          )"
          SUMMARY="$(python - <<'PY'
          import json
          print(json.load(open("reports/release_gate.json")).get("summary",""))
          PY
          )"
          SHA="$(git rev-parse HEAD)"

          if [ "$STATUS" != "ready" ]; then
            gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"               --remove-label "status:running"               --add-label "status:blocked" || true
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"               --body "Codex release gate blocked: $SUMMARY"
            exit 1
          fi

          export STATUS SUMMARY SHA
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              "version":"1.0",
              "task_id":os.environ["TASK_ID"],
              "from_agent":"codex",
              "to_agent":"workbuddy",
              "phase":"release_review",
              "status":"success",
              "summary":os.environ.get("SUMMARY",""),
              "model":"gpt-5.6-luna",
              "effort":"max",
              "required_inputs":["WorkBuddy QA reports","ChatGPT implementation","product specification"],
              "expected_outputs":["WorkBuddy deployment plan","machine-readable deployment gate"],
              "acceptance":["WorkBuddy deployment gate must be ready before automatic merge/deployment"],
              "artifacts":["CHANGELOG.md","docs/RELEASE_NOTES.md","reports/release_gate.json"],
              "checks":[],
              "blockers":[],
              "source_ref":os.environ["HEAD_REF"],
              "source_sha":os.environ["SHA"],
              "pr_number":int(os.environ["PR_NUMBER"]),
          }
          body="<!-- agent-handoff:v1 -->\n### Agent handoff: codex → workbuddy\n\n```json\n"+json.dumps(payload,ensure_ascii=False,indent=2)+"\n```\n"
          Path(os.environ["RUNNER_TEMP"],"handoff.md").write_text(body)
          PY

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"             --body-file "$RUNNER_TEMP/handoff.md"

          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --remove-label "agent:codex"             --remove-label "phase:release"             --remove-label "status:running"             --remove-label "approval:production-required"             --add-label "agent:workbuddy"             --add-label "phase:deploy"             --add-label "status:todo"

          jq -n             --argjson pr_number "$PR_NUMBER"             --arg task_id "$TASK_ID"             --arg head_ref "$HEAD_REF"             --arg source_sha "$SHA"             '{
              event_type:"agent_workbuddy_deploy",
              client_payload:{
                pr_number:$pr_number,
                task_id:$task_id,
                head_ref:$head_ref,
                source_sha:$source_sha,
                phase:"deploy"
              }
            }' | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -

      - name: Block failed release review
        if: steps.codex.outcome != 'success' || steps.release_files.outputs.value != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --remove-label "status:running"             --add-label "status:blocked" || true
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"             --body "Codex release-review failed or produced invalid release artifacts."
          exit 1
