name: Codex Implement PR

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex:
    if: >
      github.event.label.name == 'agent:codex' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark Codex running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "status:running" --repo "${{ github.repository }}" --color FBCA04 --force
          gh pr edit "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}"             --remove-label "status:todo" || true
          gh pr edit "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}"             --add-label "status:running"

      - name: Build safe Codex task prompt
        env:
          PROMPT_TEMPLATE: .github/codex/prompts/implement.md
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr=event["pull_request"]
          template=Path(os.environ["PROMPT_TEMPLATE"]).read_text()
          task=template + "\n\n## Pull request context\n" + \
               f"PR #{pr['number']}: {pr['title']}\n\n" + \
               (pr.get("body") or "")
          out=Path(os.environ["RUNNER_TEMP"])/"codex-task.md"
          out.write_text(task)
          print(out)
          PY

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-task.md
          output-file: ${{ runner.temp }}/codex-output.md
          sandbox: workspace-write

      - name: Check changes
        id: changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Block if Codex produced no changes
        if: steps.changed.outputs.value != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "status:blocked" --repo "${{ github.repository }}" --color B60205 --force
          gh pr edit "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}"             --remove-label "agent:codex"             --remove-label "status:running"             --add-label "status:blocked"
          gh pr comment "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}"             --body "Codex completed without repository changes. Manual review is required."
          exit 1

      - name: Commit and push Codex changes
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh auth setup-git
          git config user.name "codex-agent"
          git config user.email "codex-agent@users.noreply.github.com"
          git add -A
          git commit -m "feat: Codex implementation for PR #${{ github.event.pull_request.number }}"
          git push origin "HEAD:$HEAD_REF"

      - name: Hand off to final sandbox QA
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "agent:sandbox" --repo "${{ github.repository }}" --color 1D76DB --force
          gh label create "needs:qa" --repo "${{ github.repository }}" --color BFDADC --force
          gh label create "status:todo" --repo "${{ github.repository }}" --color D4C5F9 --force
          gh pr edit "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}"             --remove-label "agent:codex"             --remove-label "status:running"             --add-label "needs:qa"             --add-label "agent:sandbox"             --add-label "status:todo"
