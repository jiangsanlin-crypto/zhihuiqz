name: Agent Handoff Reconciler

on:
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: handoff-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      (vars.CONTROL_WORKFLOW_MODE == '' || vars.CONTROL_WORKFLOW_MODE == 'legacy') &&
      (github.event_name != 'issue_comment' || ( github.event.issue.pull_request != null && github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, '<!-- agent-handoff:v1 -->') ))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Resolve candidate PRs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            printf '%s\n' "$EVENT_PR" > "$RUNNER_TEMP/prs.txt"
          else
            gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
              --paginate --jq '.[].number' > "$RUNNER_TEMP/prs.txt"
          fi

      - name: Reconcile validated handoff state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          while read -r PR_NUMBER; do
            [ -n "$PR_NUMBER" ] || continue

            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              > "$RUNNER_TEMP/pr-$PR_NUMBER.json"
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100" \
              --paginate --jq '.[]' | jq -s '.' \
              > "$RUNNER_TEMP/comments-$PR_NUMBER.json"
            HEAD_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/pr-$PR_NUMBER.json")"
            gh api "repos/${{ github.repository }}/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
              --paginate --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}' \
              > "$RUNNER_TEMP/ci-$PR_NUMBER.json"

            PYTHONPATH=. python scripts/reconcile_handoff_state.py \
              --pr-json "$RUNNER_TEMP/pr-$PR_NUMBER.json" \
              --comments-json "$RUNNER_TEMP/comments-$PR_NUMBER.json" \
              --ci-runs-json "$RUNNER_TEMP/ci-$PR_NUMBER.json" \
              --repository-owner "$REPOSITORY_OWNER" \
              > "$RUNNER_TEMP/decision-$PR_NUMBER.json"

            ACTION="$(jq -r '.action' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"
            if [ "$ACTION" != "reconcile" ] && [ "$ACTION" != "ensure_qa_dispatch" ] && [ "$ACTION" != "converge_owner_wait" ] && [ "$ACTION" != "requeue_post_qa_review" ]; then
              continue
            fi

            EXPECTED_SHA="$(jq -r '.source_sha' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"
            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > "$RUNNER_TEMP/live-$PR_NUMBER.json"
            LIVE_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/live-$PR_NUMBER.json")"
            if [ "$LIVE_SHA" != "$EXPECTED_SHA" ]; then
              echo "PR #$PR_NUMBER advanced during reconciliation; skip stale decision."
              continue
            fi

            # Labels are a single projection write, not a sequence of partial
            # remove/add operations. Do not overwrite a concurrent label edit.
            if ! diff -u \
              <(jq -r '.labels_before[]' "$RUNNER_TEMP/decision-$PR_NUMBER.json") \
              <(jq -r '.labels[].name' "$RUNNER_TEMP/live-$PR_NUMBER.json" | sort); then
              echo "PR #$PR_NUMBER labels changed; retry at next reconciliation."
              continue
            fi
            if [ "$ACTION" = "requeue_post_qa_review" ]; then
              TASK_ID="$(jq -r '.task_id' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"
              if [ "$(jq -r '.write_marker' "$RUNNER_TEMP/decision-$PR_NUMBER.json")" = "true" ]; then
                printf '%s\n' '<!-- qa-postwrite-review:v1 -->' "task_id=$TASK_ID" "source_sha=$EXPECTED_SHA" 'next=NEW_INDEPENDENT_WORK_CODE_REVIEW' > "$RUNNER_TEMP/post-qa-$PR_NUMBER.md"
                gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/post-qa-$PR_NUMBER.md"
              fi
              # A comment can race with another actor. Verify the PR again
              # after publishing the marker and before projecting READY.
              gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > "$RUNNER_TEMP/live-$PR_NUMBER.json"
              test "$(jq -r '.head.sha' "$RUNNER_TEMP/live-$PR_NUMBER.json")" = "$EXPECTED_SHA"
              diff -u <(jq -r '.labels_before[]' "$RUNNER_TEMP/decision-$PR_NUMBER.json") <(jq -r '.labels[].name' "$RUNNER_TEMP/live-$PR_NUMBER.json" | sort)
              jq '{labels: .labels_after}' "$RUNNER_TEMP/decision-$PR_NUMBER.json" | gh api --method PUT "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" --input - >/dev/null
              continue
            fi
            if [ "$ACTION" = "reconcile" ] || [ "$ACTION" = "converge_owner_wait" ]; then
              jq '{labels: .labels_after}' "$RUNNER_TEMP/decision-$PR_NUMBER.json" \
                | gh api --method PUT \
                    "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" --input - >/dev/null
            fi

            # Validated QA owner wait has no downstream worker to start.
            if [ "$ACTION" = "converge_owner_wait" ]; then
              continue
            fi

            TARGET_AGENT="$(jq -r '.target_agent' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"
            TARGET_PHASE="$(jq -r '.target_phase' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"
            DESIRED_STATUS="$(jq -r '.desired_status' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"

            if [ "$ACTION" = "reconcile" ]; then
              FROM_AGENT="$(jq -r '.from_agent' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"
              PHASE="$(jq -r '.phase' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"
              MARKER="<!-- agent-handoff-reconciler:$FROM_AGENT:$PHASE:$EXPECTED_SHA -->"
              EXISTING="$(gh api \
                "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100" \
                --paginate \
                --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" \
                | head -n1)"

              if [ -z "$EXISTING" ]; then
                gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                  --body "$MARKER Reconciled the validated handoff to $TARGET_AGENT + $TARGET_PHASE + $DESIRED_STATUS at exact head $EXPECTED_SHA."
              fi
            fi

            # GITHUB_TOKEN-created label events do not wake ordinary Actions
            # pull_request:labeled consumers. repository_dispatch is explicit
            # and Validator revalidates the live exact-SHA handoff itself.
            if [ "$TARGET_PHASE" = "phase:qa" ] && [ "$DESIRED_STATUS" = "status:todo" ]; then
              DISPATCH_MARKER="<!-- agent-handoff-qa-dispatch:v1:$EXPECTED_SHA -->"
              DISPATCHED="$(gh api \
                "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100" \
                --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$DISPATCH_MARKER\"))) | .id" \
                | head -n1)"
              if [ -n "$DISPATCHED" ]; then
                continue
              fi
              TASK_ID="$(jq -r '.task_id' "$RUNNER_TEMP/decision-$PR_NUMBER.json")"
              jq -n --argjson pr_number "$PR_NUMBER" --arg task_id "$TASK_ID" \
                --arg source_sha "$EXPECTED_SHA" \
                '{event_type:"agent_workbuddy_qa",client_payload:{pr_number:$pr_number,task_id:$task_id,source_sha:$source_sha,phase:"qa"}}' \
                | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "$DISPATCH_MARKER Requested Validator QA for task $TASK_ID at exact head $EXPECTED_SHA."
            fi
          done < "$RUNNER_TEMP/prs.txt"
 
  invalid-control-mode:
    if: vars.CONTROL_WORKFLOW_MODE != '' && vars.CONTROL_WORKFLOW_MODE != 'legacy' && vars.CONTROL_WORKFLOW_MODE != 'shared'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Invalid CONTROL_WORKFLOW_MODE; no writer was started."
          exit 1

  shared-control:
    if: vars.CONTROL_WORKFLOW_MODE == 'shared'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require reviewed controller revision
        env:
          CONTROL_BUILD_SHA: ${{ vars.CONTROL_BUILD_SHA }}
        run: |
          [[ "$CONTROL_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.CONTROL_BUILD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Delegate to shared controller without legacy fallback
        env:
          CONTROL_SERVICE_URL: ${{ vars.CONTROL_SERVICE_URL }}
          CONTROL_BUILD_SHA: ${{ vars.CONTROL_BUILD_SHA }}
          CONTROL_SERVICE_TOKEN: ${{ secrets.CONTROL_SERVICE_TOKEN }}
        run: python scripts/shared_workflow_entry.py --source reconciler
