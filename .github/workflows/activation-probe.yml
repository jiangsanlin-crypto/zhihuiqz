name: Activation Probe

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[ACTIVATION PROBE]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check OpenAI-only activation state
        env:
          OPENAI_API_KEY_REPO: ${{ secrets.OPENAI_API_KEY }}
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
          ORCH_SERVER_HOST: ${{ secrets.ORCH_SERVER_HOST }}
          ORCH_SERVER_USER: ${{ secrets.ORCH_SERVER_USER }}
          ORCH_SERVER_SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          ORCH_SERVER_KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
        run: |
          REPORT="$RUNNER_TEMP/activation-report.md"
          {
            echo "## Activation probe"
            echo
            echo "| Check | State |"
            echo "| --- | --- |"
          } > "$REPORT"

          python - <<'PY' >> "$REPORT"
          import json
          policy=json.load(open("config/automation_policy.json"))
          print("| auto-production policy | " + ("✅ enabled |" if policy.get("auto_production_enabled") is True else "❌ disabled |"))
          print("| emergency stop | " + ("⛔ active |" if policy.get("emergency_stop") is True else "✅ inactive |"))
          print("| required final test gate | `" + str(policy.get("require_ci_check")) + "` |")
          PY

          if [ -n "$OPENAI_API_KEY_REPO" ]; then
            echo "| OpenAI API key | ✅ repository secret present |" >> "$REPORT"
          elif [ -n "$ORCH_ENV_B64" ] &&                printf '%s' "$ORCH_ENV_B64" | base64 -d 2>/dev/null | grep -q '^OPENAI_API_KEY='; then
            echo "| OpenAI API key | ✅ present in protected bundle |" >> "$REPORT"
          else
            echo "| OpenAI API key | ❌ missing |" >> "$REPORT"
          fi

          if printf '%s\n' '{"event_type":"activation_probe","client_payload":{"source":"activation-probe"}}' |
            GH_TOKEN="${{ github.token }}" gh api --method POST               "repos/${{ github.repository }}/dispatches" --input - >/dev/null 2>&1
          then
            echo "| built-in repository_dispatch | ✅ works |" >> "$REPORT"
          else
            echo "| built-in repository_dispatch | ❌ failed |" >> "$REPORT"
          fi

          echo "| OpenAI validation agent | ✅ GitHub Actions based |" >> "$REPORT"
          echo "| WorkBuddy OAuth/access token | ✅ not required |" >> "$REPORT"
          echo "| Persistent Orchestrator for agent routing | ✅ not required |" >> "$REPORT"

          for NAME in ORCH_SERVER_HOST ORCH_SERVER_USER ORCH_SERVER_SSH_KEY ORCH_SERVER_KNOWN_HOSTS; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              echo "| \`$NAME\` | ✅ present |" >> "$REPORT"
            else
              echo "| \`$NAME\` | ℹ️ needed only for real server deployment |" >> "$REPORT"
            fi
          done

          {
            echo
            echo "No secret values are printed by this probe."
          } >> "$REPORT"

      - name: Publish activation report
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER"             --repo "${{ github.repository }}"             --body-file "$RUNNER_TEMP/activation-report.md"
