name: Activation Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[ACTIVATION PROBE]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check secret presence and activation state
        id: probe
        env:
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          ORCH_SERVER_HOST: ${{ secrets.ORCH_SERVER_HOST }}
          ORCH_SERVER_USER: ${{ secrets.ORCH_SERVER_USER }}
          ORCH_SERVER_PORT: ${{ secrets.ORCH_SERVER_PORT }}
          ORCH_SERVER_SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          ORCH_SERVER_KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
          ORCH_SERVER_PATH: ${{ secrets.ORCH_SERVER_PATH }}
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
          AUTO_PRODUCTION_ENABLED: ${{ secrets.AUTO_PRODUCTION_ENABLED }}
          EMERGENCY_STOP: ${{ secrets.EMERGENCY_STOP }}
        run: |
          set +e

          REPORT="$RUNNER_TEMP/activation-report.md"
          {
            echo "## Activation probe"
            echo
            echo "| Check | State |"
            echo "| --- | --- |"
          } > "$REPORT"

          check_present() {
            NAME="$1"
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              echo "| \`$NAME\` | ✅ present |" >> "$REPORT"
            else
              echo "| \`$NAME\` | ❌ missing |" >> "$REPORT"
            fi
          }

          for NAME in             AGENT_GITHUB_TOKEN             OPENAI_API_KEY             ORCHESTRATOR_TOKEN             ORCHESTRATOR_URL             REPO_ADMIN_TOKEN             ORCH_SERVER_HOST             ORCH_SERVER_USER             ORCH_SERVER_SSH_KEY             ORCH_SERVER_KNOWN_HOSTS             ORCH_ENV_B64             AUTO_PRODUCTION_ENABLED             EMERGENCY_STOP
          do
            check_present "$NAME"
          done

          echo "| \`ORCH_SERVER_PORT\` | $([ -n "$ORCH_SERVER_PORT" ] && echo '✅ present' || echo 'ℹ️ optional/default 22') |" >> "$REPORT"
          echo "| \`ORCH_SERVER_PATH\` | $([ -n "$ORCH_SERVER_PATH" ] && echo '✅ present' || echo 'ℹ️ optional/default /opt/zhihuiqz-orchestrator') |" >> "$REPORT"

          if [ "$AUTO_PRODUCTION_ENABLED" = "true" ]; then
            echo "| full-auto production switch | ✅ enabled |" >> "$REPORT"
          else
            echo "| full-auto production switch | ❌ not enabled |" >> "$REPORT"
          fi

          if [ "${EMERGENCY_STOP:-}" = "false" ]; then
            echo "| emergency stop | ✅ inactive |" >> "$REPORT"
          elif [ "${EMERGENCY_STOP:-}" = "true" ]; then
            echo "| emergency stop | ⛔ active |" >> "$REPORT"
          else
            echo "| emergency stop | ❌ not configured |" >> "$REPORT"
          fi

          if [ -n "$AGENT_GITHUB_TOKEN" ]; then
            if GH_TOKEN="$AGENT_GITHUB_TOKEN" gh api "repos/${{ github.repository }}" >/dev/null 2>&1; then
              echo "| automation token repository access | ✅ works |" >> "$REPORT"
            else
              echo "| automation token repository access | ❌ invalid/insufficient |" >> "$REPORT"
            fi

            if printf '%s\n' '{"event_type":"activation_probe","client_payload":{"source":"activation-probe"}}'               | GH_TOKEN="$AGENT_GITHUB_TOKEN" gh api --method POST                 "repos/${{ github.repository }}/dispatches" --input - >/dev/null 2>&1
            then
              echo "| automation token repository_dispatch | ✅ works |" >> "$REPORT"
            else
              echo "| automation token repository_dispatch | ❌ invalid/insufficient |" >> "$REPORT"
            fi
          else
            echo "| automation token repository access | ❌ not testable |" >> "$REPORT"
            echo "| automation token repository_dispatch | ❌ not testable |" >> "$REPORT"
          fi

          if [ -n "$REPO_ADMIN_TOKEN" ]; then
            if GH_TOKEN="$REPO_ADMIN_TOKEN" gh api               "repos/${{ github.repository }}/branches/main/protection"               > "$RUNNER_TEMP/protection.json" 2>/dev/null
            then
              python - <<'PY' >> "$REPORT"
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"],"protection.json").read_text())
          contexts=(d.get("required_status_checks") or {}).get("contexts") or []
          reviews=d.get("required_pull_request_reviews") or {}
          ok=(
              "test" in contexts
              and int(reviews.get("required_approving_review_count") or 0) == 0
              and reviews.get("require_code_owner_reviews") is False
              and (d.get("enforce_admins") or {}).get("enabled") is True
              and (d.get("allow_force_pushes") or {}).get("enabled") is False
              and (d.get("allow_deletions") or {}).get("enabled") is False
          )
          print("| main protection | " + ("✅ full-auto policy active |" if ok else "❌ present but policy mismatch |"))
          PY
            else
              echo "| main protection | ❌ unavailable / token insufficient |" >> "$REPORT"
            fi
          else
            echo "| main protection | ❌ REPO_ADMIN_TOKEN missing |" >> "$REPORT"
          fi

          if [ -n "$ORCH_ENV_B64" ]; then
            printf '%s' "$ORCH_ENV_B64" | base64 -d > "$RUNNER_TEMP/server.env" 2>/dev/null
            if [ "$?" -ne 0 ]; then
              echo "| protected server env | ❌ invalid base64 |" >> "$REPORT"
            else
              python - <<'PY' >> "$REPORT"
          import os
          from pathlib import Path

          values={}
          for raw in Path(os.environ["RUNNER_TEMP"],"server.env").read_text(errors="replace").splitlines():
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              k,v=line.split("=",1)
              values[k.strip()]=v.strip()

          required=[
              "GITHUB_TOKEN",
              "GITHUB_REPOSITORY",
              "ORCHESTRATOR_TOKEN",
              "WORKBUDDY_TOKEN",
              "WORKBUDDY_MODEL",
              "WORKBUDDY_MODEL_LOCK_CONFIRMED",
          ]
          missing=[k for k in required if not values.get(k)]
          oauth_ok=bool(values.get("WORKBUDDY_ACCESS_TOKEN")) or all(
              values.get(k) for k in (
                  "WORKBUDDY_CLIENT_ID",
                  "WORKBUDDY_CLIENT_SECRET",
                  "WORKBUDDY_REFRESH_TOKEN",
              )
          )
          model_ok=(
              values.get("WORKBUDDY_MODEL") == "GLM-5.3-Flash"
              and values.get("WORKBUDDY_MODEL_LOCK_CONFIRMED","").lower()
                  in {"1","true","yes","on"}
          )
          repo_ok=values.get("GITHUB_REPOSITORY") == "jiangsanlin-crypto/zhihuiqz"

          print("| protected server env required keys | " + ("✅ complete |" if not missing else "❌ incomplete |"))
          print("| WorkBuddy model lock | " + ("✅ confirmed |" if model_ok else "❌ not confirmed |"))
          print("| WorkBuddy OAuth/access token | " + ("✅ configured |" if oauth_ok else "❌ incomplete |"))
          print("| server repository binding | " + ("✅ correct |" if repo_ok else "❌ incorrect |"))
          PY
            fi
          else
            echo "| protected server env | ❌ ORCH_ENV_B64 missing |" >> "$REPORT"
            echo "| WorkBuddy model lock | ❌ not testable |" >> "$REPORT"
            echo "| WorkBuddy OAuth/access token | ❌ not testable |" >> "$REPORT"
          fi

          if [ -n "$ORCHESTRATOR_URL" ]; then
            if curl --max-time 15 --fail-with-body -sS               "$ORCHESTRATOR_URL/readyz" > "$RUNNER_TEMP/readyz.json" 2>/dev/null
            then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"],"readyz.json").read_text())
          raise SystemExit(0 if d.get("ok") is True else 1)
          PY
              then
                echo "| live Orchestrator /readyz | ✅ ready |" >> "$REPORT"
              else
                echo "| live Orchestrator /readyz | ❌ response not ready |" >> "$REPORT"
              fi
            else
              echo "| live Orchestrator /readyz | ❌ unreachable/not deployed |" >> "$REPORT"
            fi
          else
            echo "| live Orchestrator /readyz | ❌ ORCHESTRATOR_URL missing |" >> "$REPORT"
          fi

          {
            echo
            echo "No secret values are printed by this probe."
          } >> "$REPORT"

      - name: Publish activation report
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER"             --repo "${{ github.repository }}"             --body-file "$RUNNER_TEMP/activation-report.md"
