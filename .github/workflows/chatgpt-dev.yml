name: ChatGPT Implementation (API Retired)

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: This workflow is retired; type RETIRED to confirm inspection only
        required: true
        default: RETIRED

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: API Sol worker is retired
        run: |
          echo "The API-backed ChatGPT implementation worker is retired."
          echo "Normal implementation work is owned by the account-backed ChatGPT 5.6 Sol High worker."
          echo "This workflow does not read OPENAI_API_KEY, does not call an OpenAI model, and cannot modify the repository."
          exit 1
