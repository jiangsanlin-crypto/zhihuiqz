name: ChatGPT Implementation

on:
  repository_dispatch:
    types: [agent_chatgpt_implementation]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to retry
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    # Must stay below the ChatGPT watchdog limit (120 minutes) so a long but
    # healthy implementation is never pre-empted by the watchdog.
    timeout-minutes: 110

    steps:
      - name: Require automation token and resolve PR context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER_AUTO: ${{ github.event.client_payload.pr_number }}
          PR_NUMBER_MANUAL: ${{ inputs.pr_number }}
          TASK_ID_HINT: ${{ github.event.client_payload.task_id }}
          SOURCE_SHA_HINT: ${{ github.event.client_payload.source_sha }}
        run: |
          test -n "$GH_TOKEN"
          PR_NUMBER="${PR_NUMBER_AUTO:-$PR_NUMBER_MANUAL}"
          test -n "$PR_NUMBER"

          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"

          HEAD_REF="$(jq -r '.head.ref' "$RUNNER_TEMP/pr.json")"
          SOURCE_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          BODY="$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")"
          LABELS="$(jq -r '.labels[].name' "$RUNNER_TEMP/pr.json")"

          TASK_ID="$(printf '%s' "$BODY" | sed -n 's/.*<!-- agent-task-id:\([A-Za-z0-9._:-]*\) -->.*/\1/p' | head -n1)"
          test -n "$TASK_ID"

          echo "$LABELS" | grep -qx "agent:chatgpt"
          echo "$LABELS" | grep -qx "phase:implementation"
          echo "$LABELS" | grep -qx "status:todo"

          if [ -n "$TASK_ID_HINT" ] && [ "$TASK_ID_HINT" != "$TASK_ID" ]; then
            echo "task_id mismatch: payload=$TASK_ID_HINT pr=$TASK_ID"
            exit 1
          fi

          if [ -n "$SOURCE_SHA_HINT" ] && [ "$SOURCE_SHA_HINT" != "$SOURCE_SHA" ]; then
            echo "source_sha mismatch: payload=$SOURCE_SHA_HINT pr=$SOURCE_SHA"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve OpenAI API key
        id: openai_key
        env:
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
          OPENAI_API_KEY_REPO: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/runtime_secret.py OPENAI_API_KEY             --fallback-env OPENAI_API_KEY_REPO             --output-name openai_api_key

      - name: Collect and validate WorkBuddy handoff
        id: handoff_gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          TASK_ID: ${{ steps.context.outputs.task_id }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100"             --paginate > "$RUNNER_TEMP/comments.json"

          PYTHONPATH=. python scripts/validate_handoff.py             --comments "$RUNNER_TEMP/comments.json"             --task-id "$TASK_ID"             --from-agent workbuddy             --to-agent chatgpt             --phase prototype_validation             --source-sha "$SOURCE_SHA"

          jq -r '.[] | select(.body | contains("<!-- agent-handoff:v1 -->")) | .body'             "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/handoffs.md"

      - name: Block invalid ChatGPT handoff gate
        if: steps.handoff_gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --remove-label "status:todo"             --add-label "status:blocked" || true
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"             --body "ChatGPT was not started because the required successful WorkBuddy prototype handoff was missing, blocked, or pointed at a different PR head SHA."
          exit 1

      - name: Mark ChatGPT running
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --remove-label "status:todo"             --add-label "status:running"

      - name: Build ChatGPT engineering prompt
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          TASK_ID: ${{ steps.context.outputs.task_id }}
        run: |
          {
            cat agents/chatgpt_prompt.md
            echo
            echo "## Current task"
            echo "Task ID: $TASK_ID"
            echo "PR #$PR_NUMBER"
            echo
            echo "## Prior handoffs"
            cat "$RUNNER_TEMP/handoffs.md"
          } > "$RUNNER_TEMP/chatgpt-dev.md"

      - name: Run ChatGPT development sandbox
        id: chatgpt
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ steps.openai_key.outputs.openai_api_key }}
          model: gpt-5.6-sol
          effort: high
          permission-profile: ":workspace"
          prompt-file: ${{ runner.temp }}/chatgpt-dev.md
          output-file: ${{ runner.temp }}/chatgpt-output.md

      - name: Preserve ChatGPT sandbox diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-sandbox-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/chatgpt-output.md
            ${{ runner.temp }}/chatgpt-dev.md

      - name: Validate protected paths
        if: steps.chatgpt.outcome == 'success'
        id: changed
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u > "$RUNNER_TEMP/changed.txt"

          test -s "$RUNNER_TEMP/changed.txt"

          PROTECTED='^(\.github/|\.agent/|agents/|AGENTS\.md$|docs/MODEL_POLICY\.md$|docs/PRD\.md$|docs/RECRUITMENT_RULES\.md$|docs/DATA_COLLECTION_PLAN\.md$|docs/CLASSIFICATION_DICTIONARY\.md$)'
          if grep -E "$PROTECTED" "$RUNNER_TEMP/changed.txt"; then
            echo "ChatGPT attempted to modify protected orchestration/product-policy files."
            exit 1
          fi

          echo "value=true" >> "$GITHUB_OUTPUT"

      - name: Run repository tests before commit
        if: steps.chatgpt.outcome == 'success' && steps.changed.outputs.value == 'true'
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -d tests ]; then
            PYTHONPATH=. pytest -q
          fi

      - name: Commit and push implementation
        if: steps.chatgpt.outcome == 'success' && steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          gh auth setup-git
          git config user.name "chatgpt-dev-agent"
          git config user.email "chatgpt-dev-agent@users.noreply.github.com"
          git add -A
          git commit -m "feat: ChatGPT implementation for PR #$PR_NUMBER"
          git push origin "HEAD:$HEAD_REF"

      - name: Publish handoff comment and dispatch WorkBuddy QA
        if: steps.chatgpt.outcome == 'success' && steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          TASK_ID: ${{ steps.context.outputs.task_id }}
        run: |
          SHA="$(git rev-parse HEAD)"

          # Rebuild the handoff with shell-generated summary/files to avoid stale GitHub context.
          SUMMARY="$(tail -c 3500 "$RUNNER_TEMP/chatgpt-output.md" 2>/dev/null || true)"
          FILES="$(python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"changed.txt"
          print(json.dumps([x.strip() for x in p.read_text().splitlines() if x.strip()]))
          PY
          )"

          export SUMMARY FILES SHA
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              "version":"1.0",
              "task_id":os.environ["TASK_ID"],
              "from_agent":"chatgpt",
              "to_agent":"workbuddy",
              "phase":"implementation",
              "status":"success",
              "summary":os.environ.get("SUMMARY","")[-3500:],
              "model":"gpt-5.6-sol",
              "effort":"high",
              "required_inputs":["Codex specification","WorkBuddy prototype reports","prior handoffs"],
              "expected_outputs":["WorkBuddy test report","UI/UX acceptance","classification validation"],
              "acceptance":["WorkBuddy QA must pass before Codex release review"],
              "artifacts":json.loads(os.environ["FILES"]),
              "checks":[{"name":"repository_tests","status":"passed","detail":"workflow tests completed before commit"}],
              "blockers":[],
              "source_ref":os.environ["HEAD_REF"],
              "source_sha":os.environ["SHA"],
              "pr_number":int(os.environ["PR_NUMBER"]),
          }
          body="<!-- agent-handoff:v1 -->\n### Agent handoff: chatgpt → workbuddy\n\n```json\n"+json.dumps(payload,ensure_ascii=False,indent=2)+"\n```\n"
          Path(os.environ["RUNNER_TEMP"],"handoff.md").write_text(body)
          PY

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"             --body-file "$RUNNER_TEMP/handoff.md"

          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --remove-label "agent:chatgpt"             --remove-label "phase:implementation"             --remove-label "status:running"             --add-label "phase:qa"             --add-label "status:todo"             --add-label "agent:workbuddy"

          jq -n             --argjson pr_number "$PR_NUMBER"             --arg task_id "$TASK_ID"             --arg head_ref "$HEAD_REF"             --arg source_sha "$SHA"             '{
              event_type:"agent_workbuddy_qa",
              client_payload:{
                pr_number:$pr_number,
                task_id:$task_id,
                head_ref:$head_ref,
                source_sha:$source_sha,
                phase:"qa"
              }
            }' | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -

      - name: Block failed implementation
        if: steps.chatgpt.outcome != 'success' || steps.changed.outputs.value != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}"             --remove-label "status:running"             --add-label "status:blocked" || true
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"             --body "ChatGPT implementation failed or violated protected-path rules. WorkBuddy QA was not started."
          exit 1
