name: Multi-Agent E2E Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN-E2E
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke:
    if: github.event.inputs.confirm == 'RUN-E2E'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Verify activation
        env:
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          test -n "$ORCHESTRATOR_URL"
          test -n "$OPENAI_API_KEY"
          test -n "$AGENT_GITHUB_TOKEN"
          curl --fail-with-body -sS "$ORCHESTRATOR_URL/readyz"

      - name: Create synthetic issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          ISSUE_URL="$(gh issue create             --repo "${{ github.repository }}"             --title "[E2E] three-agent chain ${{ github.run_id }}"             --body "Synthetic test. ChatGPT acceptance requirement: create tests/agent_e2e_marker.txt with exact content AGENT_E2E_OK. No production data or deployment.")"

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task_id=GH-ISSUE-$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --add-label "phase:product-plan"             --add-label "status:todo"             --add-label "agent:codex"

      - name: Wait for planning PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TASK_ID: ${{ steps.issue.outputs.task_id }}
        run: |
          for attempt in $(seq 1 80); do
            PR_NUMBER="$(gh pr list               --repo "${{ github.repository }}"               --state open               --limit 100               --json number,body               --jq ".[] | select((.body // \"\") | contains(\"<!-- agent-task-id:$TASK_ID -->\")) | .number"               | head -n1)"

            if [ -n "$PR_NUMBER" ]; then
              echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Wait for final human review state
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          for attempt in $(seq 1 160); do
            LABELS="$(gh pr view "$PR_NUMBER"               --repo "${{ github.repository }}"               --json labels --jq '.labels[].name')"

            if echo "$LABELS" | grep -qx "status:blocked"; then
              gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --comments
              exit 1
            fi

            if echo "$LABELS" | grep -qx "status:review"               && echo "$LABELS" | grep -qx "approval:production-required"               && ! echo "$LABELS" | grep -Eq '^agent:(codex|chatgpt|workbuddy)$'; then
              exit 0
            fi

            sleep 30
          done
          exit 1

      - name: Verify handoff chain
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100"             --paginate --jq '.[].body' > "$RUNNER_TEMP/comments.txt"

          for phase in product_planning prototype_validation implementation qa_acceptance release_review; do
            grep -q "\"phase\": \"$phase\"" "$RUNNER_TEMP/comments.txt"
          done

      - name: Verify ChatGPT implementation marker
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}"             --json headRefOid --jq '.headRefOid')"

          VALUE="$(gh api             -H "Accept: application/vnd.github.raw+json"             "repos/${{ github.repository }}/contents/tests/agent_e2e_marker.txt?ref=$HEAD_SHA")"

          test "$VALUE" = "AGENT_E2E_OK"

      - name: Record result
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --body "E2E passed: Codex -> WorkBuddy -> ChatGPT -> WorkBuddy -> Codex -> human review. PR #$PR_NUMBER remains unmerged."
