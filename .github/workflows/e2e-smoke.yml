name: Multi-Agent E2E Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN-E2E
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke:
    if: github.event.inputs.confirm == 'RUN-E2E'
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Verify activation secrets
        env:
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$ORCHESTRATOR_URL"
          test -n "$ORCHESTRATOR_TOKEN"
          test -n "$OPENAI_API_KEY"
          curl --fail-with-body -sS "$ORCHESTRATOR_URL/readyz"

      - name: Ensure E2E label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "test:e2e" \
            --repo "${{ github.repository }}" \
            --color "BFD4F2" \
            --description "Synthetic multi-agent end-to-end smoke test" \
            --force

      - name: Create synthetic source issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_URL="$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "[E2E] multi-agent handoff smoke ${{ github.run_id }}" \
            --body "Preparing synthetic smoke task. The workflow will update this body before routing.")"

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          TASK_ID="GH-ISSUE-$ISSUE_NUMBER"

          cat > "$RUNNER_TEMP/e2e-body.md" <<EOF
          # Synthetic multi-agent E2E smoke test

          Stable task ID: $TASK_ID

          This is a synthetic test. Do not use real candidate, employer, payment, or production data.

          Product/specification scope:
          - keep the normal Khmer -> English -> Chinese language priority;
          - preserve the rule that payment never directly increases relevance score;
          - make the smallest valid specification update needed for this smoke test.

          Engineering acceptance task for Codex:
          - create or update `tests/agent_e2e_marker.txt`;
          - its exact content must be `AGENT_E2E_OK`;
          - do not make unrelated production feature changes.

          The expected chain is:
          WorkBuddy specification -> Sandbox spec QA -> Codex implementation ->
          Sandbox final QA -> WorkBuddy final review -> human review.

          Never merge main or deploy production.
          EOF

          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file "$RUNNER_TEMP/e2e-body.md"

          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Start WorkBuddy phase
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --add-label "test:e2e" \
            --add-label "status:todo" \
            --add-label "agent:workbuddy"

      - name: Wait for specification PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.issue.outputs.task_id }}
        run: |
          for attempt in $(seq 1 60); do
            PR_NUMBER="$(gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 100 \
              --json number,body \
              --jq ".[] | select((.body // \"\") | contains(\"<!-- agent-task-id:$TASK_ID -->\")) | .number" \
              | head -n1)"

            if [ -n "$PR_NUMBER" ]; then
              echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for WorkBuddy specification PR."
          exit 1

      - name: Wait for complete handoff chain
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          for attempt in $(seq 1 120); do
            LABELS="$(gh pr view "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --json labels \
              --jq '.labels[].name')"

            echo "Current labels:"
            echo "$LABELS"

            if echo "$LABELS" | grep -qx "status:blocked"; then
              echo "Pipeline blocked."
              gh pr view "$PR_NUMBER" \
                --repo "${{ github.repository }}" \
                --comments
              exit 1
            fi

            if echo "$LABELS" | grep -qx "status:review" \
              && ! echo "$LABELS" | grep -Eq '^agent:(workbuddy|sandbox|codex)$'; then
              exit 0
            fi

            sleep 30
          done

          echo "Timed out waiting for final human-review state."
          exit 1

      - name: Verify all five handoff phases
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api \
            "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100" \
            --paginate \
            --jq '.[].body' > "$RUNNER_TEMP/e2e-comments.txt"

          for phase in specification spec_qa implementation final_qa product_review; do
            if ! grep -q "\"phase\": \"$phase\"" "$RUNNER_TEMP/e2e-comments.txt"; then
              echo "Missing handoff phase: $phase"
              cat "$RUNNER_TEMP/e2e-comments.txt"
              exit 1
            fi
          done

      - name: Verify Codex smoke artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          HEAD_SHA="$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json headRefOid \
            --jq '.headRefOid')"

          VALUE="$(gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/tests/agent_e2e_marker.txt?ref=$HEAD_SHA")"

          test "$VALUE" = "AGENT_E2E_OK"

      - name: Record successful smoke result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "E2E smoke passed through all five agent phases. PR #$PR_NUMBER is intentionally left unmerged for human inspection."

          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "✅ Multi-agent E2E smoke passed. This synthetic PR is intentionally not merged automatically."
