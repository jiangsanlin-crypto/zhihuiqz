name: Multi-Agent E2E Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN-E2E
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke:
    if: github.event.inputs.confirm == 'RUN-E2E'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Resolve OpenAI API key
        id: openai_key
        env:
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
          OPENAI_API_KEY_REPO: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/runtime_secret.py OPENAI_API_KEY             --fallback-env OPENAI_API_KEY_REPO             --output-name openai_api_key

      - name: Verify activation
        env:
          OPENAI_API_KEY: ${{ steps.openai_key.outputs.openai_api_key }}
        run: |
          test -n "$OPENAI_API_KEY"

          python scripts/check_model_policy.py
          python scripts/check_dispatch_policy.py
          python scripts/check_full_auto_policy.py

          python - <<'PY'
          import json
          policy=json.load(open("config/automation_policy.json"))
          if policy.get("auto_production_enabled") is not True:
              raise SystemExit("auto production is disabled")
          if policy.get("emergency_stop") is True:
              raise SystemExit("emergency stop is active")
          PY

      - name: Create synthetic source issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_URL="$(gh issue create             --repo "${{ github.repository }}"             --title "[E2E] three-agent full-auto chain ${{ github.run_id }}"             --body "Synthetic coordination test. ChatGPT acceptance requirement: create tests/agent_e2e_marker.txt with exact content AGENT_E2E_OK. Do not use production data.")"

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task_id=GH-ISSUE-$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          gh issue edit "$ISSUE_NUMBER"             --repo "${{ github.repository }}"             --add-label "phase:product-plan"             --add-label "status:todo"

          gh issue edit "$ISSUE_NUMBER"             --repo "${{ github.repository }}"             --add-label "agent:codex"

          jq -n             --argjson issue_number "$ISSUE_NUMBER"             '{
              event_type:"agent_codex_product",
              client_payload:{issue_number:$issue_number}
            }' | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -

      - name: Wait for planning PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.issue.outputs.task_id }}
        run: |
          for attempt in $(seq 1 80); do
            PR_NUMBER="$(gh pr list               --repo "${{ github.repository }}"               --state open               --limit 100               --json number,body               --jq ".[] | select((.body // \"\") | contains(\"<!-- agent-task-id:$TASK_ID -->\")) | .number"               | head -n1)"

            if [ -n "$PR_NUMBER" ]; then
              echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for planning PR."
          exit 1

      - name: Wait for full-auto completion state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          for attempt in $(seq 1 200); do
            LABELS="$(gh pr view "$PR_NUMBER"               --repo "${{ github.repository }}"               --json labels               --jq '.labels[].name')"

            if echo "$LABELS" | grep -qx "status:blocked"; then
              gh pr view "$PR_NUMBER"                 --repo "${{ github.repository }}"                 --comments
              exit 1
            fi

            if echo "$LABELS" | grep -qx "status:done"               && ! echo "$LABELS" | grep -Eq '^agent:(codex|chatgpt|workbuddy)$'; then
              exit 0
            fi

            sleep 30
          done

          echo "Timed out waiting for full-auto completion."
          exit 1

      - name: Verify full handoff chain
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api             "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100"             --paginate             --jq '.[].body'             > "$RUNNER_TEMP/comments.txt"

          for phase in             product_planning             prototype_validation             implementation             qa_acceptance             release_review             deployment_plan
          do
            grep -q "\"phase\": \"$phase\"" "$RUNNER_TEMP/comments.txt"
          done

      - name: Verify ChatGPT implementation marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          HEAD_SHA="$(gh pr view "$PR_NUMBER"             --repo "${{ github.repository }}"             --json headRefOid             --jq '.headRefOid')"

          VALUE="$(gh api             -H "Accept: application/vnd.github.raw+json"             "repos/${{ github.repository }}/contents/tests/agent_e2e_marker.txt?ref=$HEAD_SHA")"

          test "$VALUE" = "AGENT_E2E_OK"

      - name: Record result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER"             --repo "${{ github.repository }}"             --body "✅ E2E passed through Codex -> OpenAI Validator -> ChatGPT -> OpenAI Validator -> Codex -> OpenAI Validator deployment gate -> automatic completion. Synthetic E2E intentionally skipped real merge/server deployment."

          gh pr comment "$PR_NUMBER"             --repo "${{ github.repository }}"             --body "✅ Full-auto E2E passed. This synthetic PR remains unmerged by design."
