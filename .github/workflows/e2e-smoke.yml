name: Shared Full-Auto E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN-E2E
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  smoke:
    if: github.event.inputs.confirm == 'RUN-E2E'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ORCH_SERVER_HOST: ${{ secrets.ORCH_SERVER_HOST }}
      ORCH_SERVER_USER: ${{ secrets.ORCH_SERVER_USER }}
      ORCH_SERVER_PORT: ${{ secrets.ORCH_SERVER_PORT }}
      ORCH_SERVER_SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
      ORCH_SERVER_KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
      ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
      CONTROL_SERVICE_URL: ${{ vars.CONTROL_SERVICE_URL }}
      CONTROL_SERVICE_TOKEN: ${{ secrets.CONTROL_SERVICE_TOKEN }}
      CONTROL_BUILD_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt

      - name: Verify shared controller
        run: python scripts/shared_workflow_entry.py --source watchdog

      - name: Create clean acceptance issue
        id: issue
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/e2e-issue.md" <<'EOF'
          <!-- synthetic-e2e:true -->
          terminal_policy: owner_approval_required

          Clean full-auto acceptance task.
          Implementation acceptance: create tests/agent_e2e_marker.txt with exact content AGENT_E2E_OK.
          Do not use production data.
          The machine chain must stop at Human Approval; never merge or deploy this synthetic task.
          EOF
          ISSUE_URL="$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[E2E] shared exact-SHA automation ${{ github.run_id }}" \
            --body-file "$RUNNER_TEMP/e2e-issue.md")"
          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task_id=GH-ISSUE-$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wake planning intake
        run: python scripts/shared_workflow_entry.py --source planner

      - name: Wait for planning PR
        id: pr
        env:
          TASK_ID: ${{ steps.issue.outputs.task_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100               --json number,body               --jq ".[] | select((.body // \"\") | contains(\"<!-- agent-task-id:$TASK_ID -->\")) | .number"               | head -n1)"
            if [ -n "$PR_NUMBER" ]; then
              echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for shared planning publication."
          exit 1

      - name: Wait for canonical Human Approval
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 600); do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
            LABELS="$(jq -r '.labels[].name' "$RUNNER_TEMP/pr.json")"
            if printf '%s\n' "$LABELS" | grep -qx 'status:blocked'; then
              gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comments || true
              exit 1
            fi
            if printf '%s\n' "$LABELS" | grep -qx 'status:review'                && printf '%s\n' "$LABELS" | grep -qx 'approval:production-required'                && ! printf '%s\n' "$LABELS" | grep -Eq '^(agent:|phase:|status:todo|status:running|status:blocked)'; then
              exit 0
            fi
            sleep 30
          done
          echo "Timed out before canonical Human Approval."
          exit 1

      - name: Verify exact-final-SHA evidence and no active route
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          TASK_ID: ${{ steps.issue.outputs.task_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          FINAL_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          HEAD_REF="$(jq -r '.head.ref' "$RUNNER_TEMP/pr.json")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate             --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/comments.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$FINAL_SHA&per_page=100"             --jq '.workflow_runs' > "$RUNNER_TEMP/runs.json"

          jq -e --arg sha "$FINAL_SHA" --arg branch "$HEAD_REF"             '[.[] | select(.head_sha==$sha and .head_branch==$branch and .name=="CI" and .path==".github/workflows/ci.yml" and .event=="pull_request")] | sort_by(.created_at,.id) | last | .status=="completed" and .conclusion=="success"'             "$RUNNER_TEMP/runs.json" >/dev/null

          PYTHONPATH=. python scripts/validate_handoff.py             --comments "$RUNNER_TEMP/comments.json" --task-id "$TASK_ID"             --from-agent workreview --to-agent workbuddy --phase code_review             --source-sha "$FINAL_SHA"             --trusted-login "${{ github.repository_owner }}"             --require-independent-review

          PYTHONPATH=. python scripts/validate_handoff.py             --comments "$RUNNER_TEMP/comments.json" --task-id "$TASK_ID"             --from-agent workbuddy --to-agent human --phase qa_acceptance             --source-sha "$FINAL_SHA"             --trusted-login "github-actions[bot]"             --trusted-login "${{ github.repository_owner }}"

          test "$(jq -r '[.labels[].name | select(startswith("agent:") or startswith("phase:") or .=="status:todo" or .=="status:running" or .=="status:blocked")] | length' "$RUNNER_TEMP/pr.json")" = "0"

      - name: Verify implementation marker
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          FINAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          VALUE="$(gh api -H "Accept: application/vnd.github.raw+json"             "repos/$GITHUB_REPOSITORY/contents/tests/agent_e2e_marker.txt?ref=$FINAL_SHA")"
          test "$VALUE" = "AGENT_E2E_OK"

      - name: Record acceptance without leaving Human Approval
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "Shared full-auto E2E reached canonical Human Approval with current-SHA CI, independent Review and final QA. No merge or deployment was performed."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "<!-- shared-e2e:passed --> Full-auto acceptance passed at Human Approval. Synthetic PR intentionally remains unmerged."
