name: Configure Main Protection

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROTECT-MAIN
        required: true

permissions:
  contents: read

jobs:
  protect:
    if: github.event.inputs.confirm == 'PROTECT-MAIN'
    runs-on: ubuntu-latest
    environment: repository-administration
    steps:
      - name: Require admin token
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          test -n "$GH_TOKEN"

      - name: Protect main
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/protection.json" <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["test"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true,
              "required_approving_review_count": 1,
              "require_last_push_approval": true
            },
            "restrictions": null,
            "required_conversation_resolution": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_linear_history": false,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON

          gh api             --method PUT             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${{ github.repository }}/branches/main/protection"             --input "$RUNNER_TEMP/protection.json"

      - name: Verify protection
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${{ github.repository }}/branches/main/protection"             > "$RUNNER_TEMP/protection-result.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          p=Path(os.environ["RUNNER_TEMP"])/"protection-result.json"
          d=json.loads(p.read_text())

          assert d["enforce_admins"]["enabled"] is True
          assert d["required_pull_request_reviews"]["required_approving_review_count"] >= 1
          assert d["required_pull_request_reviews"]["require_code_owner_reviews"] is True
          assert d["allow_force_pushes"]["enabled"] is False
          assert d["allow_deletions"]["enabled"] is False

          contexts=d["required_status_checks"]["contexts"]
          assert "test" in contexts
          print("main branch protection verified")
          PY
