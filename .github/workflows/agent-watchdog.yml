name: Agent Handoff Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-watchdog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  watchdog:
    if: vars.CONTROL_WORKFLOW_MODE == '' || vars.CONTROL_WORKFLOW_MODE == 'legacy'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure watchdog policy labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "watchdog:timeout"             --repo "${{ github.repository }}"             --color B60205             --description "Agent exceeded its running-time policy"             --force

      - name: Warn on queued handoffs after agent-specific limits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for SPEC in "codex:10" "workbuddy:10" "chatgpt:70" "workreview:70"; do
            AGENT="${SPEC%%:*}"
            LIMIT="${SPEC##*:}"
            THRESHOLD="$(date -u -d "$LIMIT minutes ago" '+%Y-%m-%dT%H:%M:%SZ')"
            QUERY="repo:${{ github.repository }} is:open label:status:todo label:agent:$AGENT updated:<$THRESHOLD"

            gh api --method GET search/issues --paginate -f q="$QUERY" -f per_page=100 \
              --jq '.items[].number' > "$RUNNER_TEMP/queued-$AGENT.txt"

            while read -r NUMBER; do
              [ -n "$NUMBER" ] || continue

              LABELS="$(gh issue view "$NUMBER"                 --repo "${{ github.repository }}"                 --json labels                 --jq '.labels[].name')"

              PHASE="$(echo "$LABELS" | grep '^phase:' | head -n1 || true)"
              IS_PR="$(gh api "repos/${{ github.repository }}/issues/$NUMBER" --jq 'has("pull_request")')"
              if [ "$IS_PR" = "true" ]; then
                # Historical synthetic E2E tasks have no active worker. Do not
                # repeatedly alert on them unless the source issue opted in.
                ROOT_ISSUE="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" \
                  --json body --jq '.body // ""' \
                  | sed -n 's/.*agent-task-id:GH-ISSUE-\([0-9][0-9]*\).*/\1/p' | head -n1)"
                if [ -n "$ROOT_ISSUE" ]; then
                  ROOT_TITLE="$(gh issue view "$ROOT_ISSUE" --repo "${{ github.repository }}" --json title --jq '.title' 2>/dev/null || true)"
                  ROOT_BODY="$(gh issue view "$ROOT_ISSUE" --repo "${{ github.repository }}" --json body --jq '.body // ""' 2>/dev/null || true)"
                  if [[ "$ROOT_TITLE" == "[E2E]"* ]] && ! printf '%s' "$ROOT_BODY" | grep -Fq '<!-- synthetic-e2e:true -->'; then
                    continue
                  fi
                fi
                REV="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
              else
                REV="issue-$NUMBER"
              fi
              MARKER="<!-- agent-watchdog:queued:$AGENT:$PHASE:$REV -->"

              ALREADY="$(gh api                 "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100"                 --paginate                 --jq ".[] | select(.body | contains(\"$MARKER\")) | .id"                 | head -n1)"

              if [ -n "$ALREADY" ]; then
                continue
              fi

              gh issue comment "$NUMBER"                 --repo "${{ github.repository }}"                 --body "$MARKER ⚠️ Central watchdog: handoff to $AGENT ($PHASE) has remained queued for more than $LIMIT minutes. The watchdog will not skip the phase or start another worker. Check the owning API workflow or account worker and retry the same phase if needed."
            done < "$RUNNER_TEMP/queued-$AGENT.txt"
          done

      - name: Requeue exact-SHA technical failures with bounded budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QUERY="repo:${{ github.repository }} is:open label:status:blocked label:recovery:technical"
          gh api --method GET search/issues --paginate -f q="$QUERY" -f per_page=100 --jq '.items[].number' > "$RUNNER_TEMP/technical-blocked.txt"

          while read -r NUMBER; do
            [ -n "$NUMBER" ] || continue
            ISSUE_JSON="$RUNNER_TEMP/technical-$NUMBER.json"
            gh api "repos/${{ github.repository }}/issues/$NUMBER" > "$ISSUE_JSON"
            LABELS="$(jq -r '.labels[].name' "$ISSUE_JSON")"
            AGENT_LABEL="$(printf '%s\n' "$LABELS" | grep '^agent:' | head -n1 || true)"
            PHASE="$(printf '%s\n' "$LABELS" | grep '^phase:' | head -n1 || true)"
            [ -n "$AGENT_LABEL" ] && [ -n "$PHASE" ] || continue
            AGENT="${AGENT_LABEL#agent:}"

            IS_PR="$(jq -r 'has("pull_request")' "$ISSUE_JSON")"
            if [ "$IS_PR" = "true" ]; then
              REV="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
            else
              REV="issue-$NUMBER"
            fi

            FAILURE_MARKER="<!-- agent-technical-failure:v1:$AGENT:$PHASE:$REV -->"
            HAS_FAILURE="$(gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" --paginate --jq ".[] | select(.body | contains(\"$FAILURE_MARKER\")) | .id" | head -n1)"
            if [ -z "$HAS_FAILURE" ]; then
              echo "#$NUMBER lacks exact-current-revision technical failure evidence; fail closed."
              continue
            fi

            PREFIX="<!-- agent-watchdog:technical-retry:$AGENT:$PHASE:$REV:"
            COUNT="$(gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" \
              --paginate --jq ".[] | select(.body | startswith(\"$PREFIX\")) | .id" | wc -l | tr -d ' ')"
            if [ "$COUNT" -ge 2 ]; then
              gh issue edit "$NUMBER" --repo "${{ github.repository }}" --remove-label "recovery:technical" || true
              EXHAUSTED="<!-- agent-watchdog:technical-exhausted:$AGENT:$PHASE:$REV -->"
              EXISTING="$(gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" --paginate --jq ".[] | select(.body | contains(\"$EXHAUSTED\")) | .id" | head -n1)"
              if [ -z "$EXISTING" ]; then
                gh issue comment "$NUMBER" --repo "${{ github.repository }}"                   --body "$EXHAUSTED Technical retry budget exhausted after 2 automatic attempts at exact revision $REV. Task remains status:blocked."
              fi
              continue
            fi

            ATTEMPT=$((COUNT + 1))
            gh issue edit "$NUMBER" --repo "${{ github.repository }}"               --remove-label "status:blocked"               --add-label "status:todo"
            gh issue comment "$NUMBER" --repo "${{ github.repository }}"               --body "$PREFIX$ATTEMPT --> 🔁 Requeued retryable technical failure at exact revision $REV (attempt $ATTEMPT/2). API redispatch remains exact-SHA/idempotent."
          done < "$RUNNER_TEMP/technical-blocked.txt"

      - name: Redispatch queued API-owned phases with bounded idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          THRESHOLD="$(date -u -d '10 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"

          for AGENT in codex workbuddy; do
            QUERY="repo:${{ github.repository }} is:open label:status:todo label:agent:$AGENT updated:<$THRESHOLD"
            gh api --method GET search/issues --paginate -f q="$QUERY" -f per_page=100 --jq '.items[].number' > "$RUNNER_TEMP/redispatch-$AGENT.txt"

            while read -r NUMBER; do
              [ -n "$NUMBER" ] || continue
              ISSUE_JSON="$RUNNER_TEMP/issue-$NUMBER.json"
              gh api "repos/${{ github.repository }}/issues/$NUMBER" > "$ISSUE_JSON"
              IS_PR="$(jq -r 'has("pull_request")' "$ISSUE_JSON")"
              LABELS="$(jq -r '.labels[].name' "$ISSUE_JSON")"
              PHASE="$(printf '%s\n' "$LABELS" | grep '^phase:' | head -n1 || true)"

              EVENT=""
              PAYLOAD=""
              REV="issue-$NUMBER"

              if [ "$AGENT" = "codex" ] && [ "$PHASE" = "phase:product-plan" ] && [ "$IS_PR" != "true" ]; then
                EVENT="agent_codex_product"
                PAYLOAD="$(jq -n --argjson issue_number "$NUMBER" '{issue_number:$issue_number}')"
              elif [ "$IS_PR" = "true" ]; then
                PR_JSON="$RUNNER_TEMP/pr-$NUMBER.json"
                gh api "repos/${{ github.repository }}/pulls/$NUMBER" > "$PR_JSON"
                HEAD_REF="$(jq -r '.head.ref' "$PR_JSON")"
                REV="$(jq -r '.head.sha' "$PR_JSON")"
                BODY="$(jq -r '.body // ""' "$PR_JSON")"
                TASK_ID="$(printf '%s' "$BODY" | sed -n 's/.*<!-- agent-task-id:\([A-Za-z0-9._:-]*\) -->.*/\1/p' | head -n1)"
                [ -n "$TASK_ID" ] || continue

                if [ "$AGENT" = "codex" ] && [ "$PHASE" = "phase:release" ]; then
                  EVENT="agent_codex_release"
                  PHASE_VALUE="release"
                elif [ "$AGENT" = "workbuddy" ] && [ "$PHASE" = "phase:prototype" ]; then
                  EVENT="agent_workbuddy_prototype"
                  PHASE_VALUE="prototype"
                elif [ "$AGENT" = "workbuddy" ] && [ "$PHASE" = "phase:qa" ]; then
                  EVENT="agent_workbuddy_qa"
                  PHASE_VALUE="qa"
                elif [ "$AGENT" = "workbuddy" ] && [ "$PHASE" = "phase:deploy" ]; then
                  EVENT="agent_workbuddy_deploy"
                  PHASE_VALUE="deploy"
                fi

                if [ -n "$EVENT" ]; then
                  PAYLOAD="$(jq -n --argjson pr_number "$NUMBER" --arg task_id "$TASK_ID" --arg head_ref "$HEAD_REF" --arg source_sha "$REV" --arg phase "$PHASE_VALUE" '{pr_number:$pr_number,task_id:$task_id,head_ref:$head_ref,source_sha:$source_sha,phase:$phase}')"
                fi
              fi

              [ -n "$EVENT" ] || continue

              # Old ad-hoc E2E tasks are archival noise. Only new synthetic tests
              # carrying the machine-readable marker may be redispatched.
              if [ "$IS_PR" = "true" ]; then
                BODY_PR="$(jq -r '.body // ""' "$PR_JSON")"
                ROOT_ISSUE="$(printf '%s' "$BODY_PR" | sed -n 's/.*agent-task-id:GH-ISSUE-\([0-9][0-9]*\).*/\1/p' | head -n1)"
                if [ -n "$ROOT_ISSUE" ]; then
                  ROOT_TITLE="$(gh issue view "$ROOT_ISSUE" --repo "${{ github.repository }}" --json title --jq '.title' 2>/dev/null || true)"
                  ROOT_BODY="$(gh issue view "$ROOT_ISSUE" --repo "${{ github.repository }}" --json body --jq '.body // ""' 2>/dev/null || true)"
                  if [[ "$ROOT_TITLE" == "[E2E]"* ]] && ! printf '%s' "$ROOT_BODY" | grep -Fq '<!-- synthetic-e2e:true -->'; then
                    continue
                  fi
                fi
              fi

              PREFIX="<!-- agent-watchdog:redispatch:$AGENT:$PHASE:$REV:"
              COUNT="$(gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" \
                --paginate --jq ".[] | select(.body | startswith(\"$PREFIX\")) | .id" | wc -l | tr -d ' ')"
              if [ "$COUNT" -ge 2 ]; then
                continue
              fi
              ATTEMPT=$((COUNT + 1))

              jq -n --arg event_type "$EVENT" --argjson client_payload "$PAYLOAD" '{event_type:$event_type,client_payload:$client_payload}'               | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -
              gh issue edit "$NUMBER" --repo "${{ github.repository }}" --remove-label "recovery:technical" || true

              gh issue comment "$NUMBER" --repo "${{ github.repository }}"                 --body "$PREFIX$ATTEMPT --> 🔁 Watchdog redispatched $EVENT for exact revision $REV (attempt $ATTEMPT/2)."
            done < "$RUNNER_TEMP/redispatch-$AGENT.txt"
          done

      - name: Block Codex running longer than 55 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AGENT="codex"
          LIMIT="55"
          THRESHOLD="$(date -u -d "$LIMIT minutes ago" '+%Y-%m-%dT%H:%M:%SZ')"
          QUERY="repo:${{ github.repository }} is:open label:status:running label:agent:$AGENT updated:<$THRESHOLD"

          gh api --method GET search/issues -f q="$QUERY" --jq '.items[].number' > "$RUNNER_TEMP/running-$AGENT.txt"

          while read -r NUMBER; do
            [ -n "$NUMBER" ] || continue
            IS_PR="$(gh api "repos/${{ github.repository }}/issues/$NUMBER" --jq 'has("pull_request")')"
            if [ "$IS_PR" = "true" ]; then
              REV="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
            else
              REV="issue-$NUMBER"
            fi
            gh issue edit "$NUMBER" --repo "${{ github.repository }}"               --remove-label "status:running"               --add-label "status:blocked"               --add-label "watchdog:timeout" || true

            gh issue comment "$NUMBER" --repo "${{ github.repository }}"               --body "<!-- agent-watchdog:timeout:$AGENT:$REV --> ⏱ Central watchdog: Codex exceeded the 55-minute running limit. The task was blocked instead of advancing. Inspect the latest handoff/workflow logs and retry the same Codex phase after resolving the cause."
          done < "$RUNNER_TEMP/running-$AGENT.txt"

      - name: Block OpenAI Validator phases after phase-specific timeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prototype/QA: 30 minutes. Deployment: 45 minutes because it includes
          # required-check waiting plus 0/1/5/15-minute production health gates.
          for SPEC in "phase:prototype:30" "phase:qa:30" "phase:deploy:45"; do
            PHASE="${SPEC%:*}"
            LIMIT="${SPEC##*:}"
            THRESHOLD="$(date -u -d "$LIMIT minutes ago" '+%Y-%m-%dT%H:%M:%SZ')"
            QUERY="repo:${{ github.repository }} is:open label:status:running label:agent:workbuddy label:$PHASE updated:<$THRESHOLD"

            gh api --method GET search/issues -f q="$QUERY" --jq '.items[].number' > "$RUNNER_TEMP/workbuddy-${PHASE#phase:}.txt"

            while read -r NUMBER; do
              [ -n "$NUMBER" ] || continue
              REV="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
              gh issue edit "$NUMBER" --repo "${{ github.repository }}"                 --remove-label "status:running"                 --add-label "status:blocked"                 --add-label "watchdog:timeout" || true

              gh issue comment "$NUMBER" --repo "${{ github.repository }}"                 --body "<!-- agent-watchdog:timeout:workbuddy:$PHASE:$REV --> ⏱ Central watchdog: OpenAI Validator exceeded the $LIMIT-minute limit for $PHASE. The task was blocked instead of advancing."
            done < "$RUNNER_TEMP/workbuddy-${PHASE#phase:}.txt"
          done

      - name: Reclaim orphaned exact-SHA Work review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QUERY="repo:${{ github.repository }} is:pr is:open label:agent:workreview label:phase:code-review label:status:running"
          gh api --method GET search/issues --paginate -f q="$QUERY" -f per_page=100 \
            --jq '.items[].number' > "$RUNNER_TEMP/review-running.txt"
          while read -r NUMBER; do
            [ -n "$NUMBER" ] || continue
            PR="$RUNNER_TEMP/review-$NUMBER.json"
            DECISION="$RUNNER_TEMP/review-decision-$NUMBER.json"
            gh api "repos/${{ github.repository }}/pulls/$NUMBER" > "$PR"
            SHA="$(jq -r '.head.sha' "$PR")"
            gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" \
              --paginate --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/review-comments-$NUMBER.json"
            gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
              --paginate --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}' \
              > "$RUNNER_TEMP/review-ci-$NUMBER.json"
            PYTHONPATH=. python scripts/plan_review_reclaim.py \
              --pr-json "$PR" \
              --comments-json "$RUNNER_TEMP/review-comments-$NUMBER.json" \
              --ci-runs-json "$RUNNER_TEMP/review-ci-$NUMBER.json" \
              --repository-owner "${{ github.repository_owner }}" \
              --now "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$DECISION"
            [ "$(jq -r '.action' "$DECISION")" = "requeue" ] || continue

            gh api "repos/${{ github.repository }}/pulls/$NUMBER" > "$RUNNER_TEMP/review-live-$NUMBER.json"
            [ "$(jq -r '.head.sha' "$RUNNER_TEMP/review-live-$NUMBER.json")" = "$SHA" ] || continue
            if ! diff -u \
              <(jq -r '.labels_before[]' "$DECISION") \
              <(jq -r '.labels[].name' "$RUNNER_TEMP/review-live-$NUMBER.json" | sort); then
              continue
            fi
            jq '{labels: .labels_after}' "$DECISION" | gh api --method PUT \
              "repos/${{ github.repository }}/issues/$NUMBER/labels" --input - >/dev/null
            gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
              --body "<!-- agent-recovery:v1:$NUMBER:$SHA:code-review --> rule_id=R04_EXPIRED_REVIEW_RUNNING source_sha=$SHA last_progress_at=$(jq -r '.last_progress_at' "$DECISION") next=status:todo. No independent PASS was bypassed."
          done < "$RUNNER_TEMP/review-running.txt"

      - name: Re-evaluate Work repair CI blockers and restore independent review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create "recovery:repair-ci" --repo "${{ github.repository }}" \
            --color B60205 --description "Review repair awaits recoverable current-SHA CI" --force
          QUERY="repo:${{ github.repository }} is:pr is:open label:agent:workreview label:phase:escalation-repair"
          gh api --method GET search/issues --paginate -f q="$QUERY" -f per_page=100 \
            --jq '.items[].number' > "$RUNNER_TEMP/repair-prs.txt"
          while read -r NUMBER; do
            [ -n "$NUMBER" ] || continue
            PR="$RUNNER_TEMP/repair-pr-$NUMBER.json"
            COMMENTS="$RUNNER_TEMP/repair-comments-$NUMBER.json"
            RUNS="$RUNNER_TEMP/repair-ci-$NUMBER.json"
            DECISION="$RUNNER_TEMP/repair-decision-$NUMBER.json"
            gh api "repos/${{ github.repository }}/pulls/$NUMBER" > "$PR"
            SHA="$(jq -r '.head.sha' "$PR")"
            gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" \
              --paginate --jq '.[]' | jq -s '.' > "$COMMENTS"
            gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
              --paginate --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}' > "$RUNS"
            PYTHONPATH=. python scripts/plan_repair_recovery.py \
              --pr-json "$PR" --comments-json "$COMMENTS" --ci-runs-json "$RUNS" \
              --repository-owner "${{ github.repository_owner }}" \
              --now "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$DECISION"
            ACTION="$(jq -r '.action' "$DECISION")"
            [ "$ACTION" = "block" ] || [ "$ACTION" = "requeue_review" ] || continue

            # GitHub issue-label PUT has no conditional write. Re-read HEAD and
            # the exact label set immediately before projecting a new state.
            gh api "repos/${{ github.repository }}/pulls/$NUMBER" \
              > "$RUNNER_TEMP/repair-live-$NUMBER.json"
            [ "$(jq -r '.head.sha' "$RUNNER_TEMP/repair-live-$NUMBER.json")" = "$SHA" ] || continue
            if ! diff -u <(jq -r '.labels_before[]' "$DECISION") \
              <(jq -r '.labels[].name' "$RUNNER_TEMP/repair-live-$NUMBER.json" | sort); then
              continue
            fi
            jq '{labels: .labels_after}' "$DECISION" | gh api --method PUT \
              "repos/${{ github.repository }}/issues/$NUMBER/labels" --input - >/dev/null
            REASON="$(jq -r '.reason // "current_sha_ci_success"' "$DECISION")"
            CI_ID="$(jq -r '.ci_run_id // "none"' "$DECISION")"
            gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
              --body "<!-- agent-repair-recovery:v1:$SHA:$ACTION --> rule_id=R05_R06_REPAIR_CI source_sha=$SHA reason=$REASON ci_run_id=$CI_ID action=$ACTION. Requeue requires a new independent Work Review PASS before QA; no release or deployment is authorized."
          done < "$RUNNER_TEMP/repair-prs.txt"

      - name: Block Work review running longer than 120 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AGENT="workreview"
          LIMIT="120"
          THRESHOLD="$(date -u -d "$LIMIT minutes ago" '+%Y-%m-%dT%H:%M:%SZ')"
          QUERY="repo:${{ github.repository }} is:open label:status:running label:agent:$AGENT updated:<$THRESHOLD"

          gh api --method GET search/issues -f q="$QUERY" --jq '.items[].number' > "$RUNNER_TEMP/running-$AGENT.txt"

          while read -r NUMBER; do
            [ -n "$NUMBER" ] || continue
            REV="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
            gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
              --remove-label "status:running" \
              --add-label "status:blocked" \
              --add-label "watchdog:timeout" || true

            gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
              --body "<!-- agent-watchdog:timeout:$AGENT:$REV --> ⏱ Central watchdog: Work code review exceeded the 120-minute running limit. The task was blocked instead of advancing to Luna QA."
          done < "$RUNNER_TEMP/running-$AGENT.txt"

      - name: Block ChatGPT running longer than 120 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AGENT="chatgpt"
          # Account Chat may need one scheduled follow-up to observe terminal CI.
          # The running timeout is therefore intentionally longer than one hourly cycle.
          LIMIT="120"
          THRESHOLD="$(date -u -d "$LIMIT minutes ago" '+%Y-%m-%dT%H:%M:%SZ')"
          QUERY="repo:${{ github.repository }} is:open label:status:running label:agent:$AGENT updated:<$THRESHOLD"

          gh api --method GET search/issues -f q="$QUERY" --jq '.items[].number' > "$RUNNER_TEMP/running-$AGENT.txt"

          while read -r NUMBER; do
            [ -n "$NUMBER" ] || continue
            REV="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
            gh issue edit "$NUMBER" --repo "${{ github.repository }}"               --remove-label "status:running"               --add-label "status:blocked"               --add-label "watchdog:timeout" || true

            gh issue comment "$NUMBER" --repo "${{ github.repository }}"               --body "<!-- agent-watchdog:timeout:$AGENT:$REV --> ⏱ Central watchdog: ChatGPT exceeded the 120-minute running limit. The task was blocked instead of advancing. Inspect the account worker / PR / CI evidence and retry the same implementation phase after resolving the cause."
          done < "$RUNNER_TEMP/running-$AGENT.txt"


      - name: Recover watchdog timeout blockers with bounded retry and escalation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QUERY="repo:${{ github.repository }} is:open label:status:blocked label:watchdog:timeout"
          gh api --method GET search/issues --paginate -f q="$QUERY" -f per_page=100 --jq '.items[].number' > "$RUNNER_TEMP/timeout-blocked.txt"

          while read -r NUMBER; do
            [ -n "$NUMBER" ] || continue
            ISSUE_JSON="$RUNNER_TEMP/timeout-$NUMBER.json"
            gh api "repos/${{ github.repository }}/issues/$NUMBER" > "$ISSUE_JSON"
            LABELS="$(jq -r '.labels[].name' "$ISSUE_JSON")"

            if printf '%s\n' "$LABELS" | grep -Eq '^(status:review|approval:production-required)$'; then
              continue
            fi

            AGENT_LABEL="$(printf '%s\n' "$LABELS" | grep '^agent:' | head -n1 || true)"
            PHASE="$(printf '%s\n' "$LABELS" | grep '^phase:' | head -n1 || true)"
            [ -n "$AGENT_LABEL" ] || continue
            AGENT="${AGENT_LABEL#agent:}"

            IS_PR="$(jq -r 'has("pull_request")' "$ISSUE_JSON")"
            if [ "$IS_PR" = "true" ]; then
              REV="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
              BODY="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json body --jq '.body // ""')"
              TASK_ID="$(printf '%s' "$BODY" | sed -n 's/.*<!-- agent-task-id:\([A-Za-z0-9._:-]*\) -->.*/\1/p' | head -n1)"
            else
              REV="issue-$NUMBER"
              TASK_ID="GH-ISSUE-$NUMBER"
            fi

            TIMEOUT_MARKER=""
            if [ "$AGENT" = "workbuddy" ]; then
              TIMEOUT_MARKER="<!-- agent-watchdog:timeout:$AGENT:$PHASE:$REV -->"
            else
              TIMEOUT_MARKER="<!-- agent-watchdog:timeout:$AGENT:$REV -->"
            fi
            HAS_CURRENT_TIMEOUT="$(gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" --paginate --jq ".[] | select(.body | contains(\"$TIMEOUT_MARKER\")) | .id" | head -n1)"
            if [ -z "$HAS_CURRENT_TIMEOUT" ]; then
              echo "PR/issue #$NUMBER has only a legacy/stale timeout marker; do not auto-revive it."
              continue
            fi

            PREFIX="<!-- agent-watchdog:auto-retry:$AGENT:$PHASE:$REV:"
            COUNT="$(gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" \
              --paginate --jq ".[] | select(.body | startswith(\"$PREFIX\")) | .id" | wc -l | tr -d ' ')"

            if [ "$COUNT" -eq 0 ]; then
              gh issue edit "$NUMBER" --repo "${{ github.repository }}"                 --remove-label "status:blocked"                 --remove-label "watchdog:timeout"                 --add-label "status:todo"
              gh issue comment "$NUMBER" --repo "${{ github.repository }}"                 --body "${PREFIX}1 --> 🔁 Watchdog automatically requeued the same owner/phase once after timeout at exact revision $REV. No phase was skipped."
              continue
            fi

            if [ "$AGENT" = "chatgpt" ] && [ "$PHASE" = "phase:implementation" ]; then
              ESC="<!-- agent-escalation:v1:$REV -->"
              EXISTING="$(gh api "repos/${{ github.repository }}/issues/$NUMBER/comments?per_page=100" --paginate --jq ".[] | select(.body | contains(\"$ESC\")) | .id" | head -n1)"
              if [ -z "$EXISTING" ]; then
                gh issue edit "$NUMBER" --repo "${{ github.repository }}"                   --remove-label "agent:chatgpt"                   --remove-label "phase:implementation"                   --remove-label "status:blocked"                   --remove-label "watchdog:timeout"                   --add-label "agent:workreview"                   --add-label "phase:escalation-repair"                   --add-label "status:todo"
                gh issue comment "$NUMBER" --repo "${{ github.repository }}"                   --body "$ESC task_id=$TASK_ID source_sha=$REV blocker_code=IMPLEMENTATION_TIMEOUT status=todo reason=Chat implementation timed out after its bounded automatic retry; routed to Work escalation-repair. This is technical recovery only and cannot self-approve."
              fi
            fi
          done < "$RUNNER_TEMP/timeout-blocked.txt"
 
  invalid-control-mode:
    if: vars.CONTROL_WORKFLOW_MODE != '' && vars.CONTROL_WORKFLOW_MODE != 'legacy' && vars.CONTROL_WORKFLOW_MODE != 'shared'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Invalid CONTROL_WORKFLOW_MODE; no writer was started."
          exit 1

  shared-control:
    if: vars.CONTROL_WORKFLOW_MODE == 'shared'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require reviewed controller revision
        env:
          CONTROL_BUILD_SHA: ${{ vars.CONTROL_BUILD_SHA }}
        run: |
          [[ "$CONTROL_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.CONTROL_BUILD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Delegate to shared controller without legacy fallback
        env:
          CONTROL_SERVICE_URL: ${{ vars.CONTROL_SERVICE_URL }}
          CONTROL_BUILD_SHA: ${{ vars.CONTROL_BUILD_SHA }}
          CONTROL_SERVICE_TOKEN: ${{ secrets.CONTROL_SERVICE_TOKEN }}
        run: python scripts/shared_workflow_entry.py --source watchdog
