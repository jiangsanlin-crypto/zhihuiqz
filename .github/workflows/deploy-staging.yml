name: Publish Staging Image
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-STAGING
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.inputs.confirm == 'DEPLOY-STAGING'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
