name: Start Agent Task

on:
  workflow_dispatch:
    inputs:
      title:
        description: Task title
        required: true
      objective:
        description: Product objective and acceptance requirements
        required: true
      priority:
        description: Priority
        required: true
        type: choice
        options:
          - normal
          - high
          - urgent

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require full-auto controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN"
          python - <<'PY'
          import json
          policy=json.load(open("config/automation_policy.json"))
          if policy.get("emergency_stop") is True:
              raise SystemExit("emergency stop is active")
          print("repository automation policy allows full-auto execution")
          PY

      - name: Create source issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          OBJECTIVE: ${{ inputs.objective }}
          PRIORITY: ${{ inputs.priority }}
        run: |
          cat > "$RUNNER_TEMP/body.md" <<EOF
          <!-- agent-root-task:v1 -->

          ## Objective

          $OBJECTIVE

          ## Priority

          $PRIORITY

          ## Mandatory workflow

          Codex product planning (API Luna)
          -> OpenAI Validator prototype/data/classification validation (API Luna)
          -> Account ChatGPT implementation (Chat 5.6 Sol High)
          -> Work GPT-6 code review / targeted repair
          -> OpenAI Validator QA/UIUX/classification acceptance
          -> Human Approval.

          No merge, release or deployment is authorized until the human owner
          explicitly acts on the exact final SHA.

          ## Safety

          - Use synthetic data unless the human owner explicitly authorizes real data.
          - Machine execution stops at Human Approval; merge/deployment requires explicit owner action.
          - Stop immediately if AUTO_PRODUCTION_ENABLED is not true or EMERGENCY_STOP is true.
          - Preserve the stable task ID and all agent-handoff records.
          - Normal implementation must not dispatch the retired API Sol workflow.
          - Urgent/high-difficulty work may be escalated to the account Work GPT-6 path after its shadow gate is proven.
          EOF

          ISSUE_URL="$(gh issue create             --repo "${{ github.repository }}"             --title "$TITLE"             --body-file "$RUNNER_TEMP/body.md")"

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      - name: Wake shared controller
        id: wake
        continue-on-error: true
        env:
          CONTROL_BUILD_SHA: ${{ github.sha }}
          ORCH_SERVER_HOST: ${{ secrets.ORCH_SERVER_HOST }}
          ORCH_SERVER_USER: ${{ secrets.ORCH_SERVER_USER }}
          ORCH_SERVER_PORT: ${{ secrets.ORCH_SERVER_PORT }}
          ORCH_SERVER_SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          ORCH_SERVER_KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
          CONTROL_SERVICE_URL: ${{ vars.CONTROL_SERVICE_URL }}
          CONTROL_SERVICE_TOKEN: ${{ secrets.CONTROL_SERVICE_TOKEN }}
        run: python scripts/shared_workflow_entry.py --source planner

      - name: Summary
        run: |
          {
            echo "## Agent task started"
            echo
            echo "- Issue: #${{ steps.issue.outputs.number }}"
            echo "- Shared controller discovers and leases the Issue"
            echo "- First executor: Codex product planning"
            echo "- Machine chain ends at exact-SHA Human Approval"
          } >> "$GITHUB_STEP_SUMMARY"
