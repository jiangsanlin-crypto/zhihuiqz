name: Start Agent Task

on:
  workflow_dispatch:
    inputs:
      title:
        description: Task title
        required: true
      objective:
        description: Product objective and acceptance requirements
        required: true
      priority:
        description: Priority
        required: true
        type: choice
        options:
          - normal
          - high
          - urgent

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require full-auto controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN"
          python - <<'PY'
          import json
          policy=json.load(open("config/automation_policy.json"))
          if policy.get("auto_production_enabled") is not True:
              raise SystemExit("auto production is disabled by repository policy")
          if policy.get("emergency_stop") is True:
              raise SystemExit("emergency stop is active")
          print("repository automation policy allows full-auto execution")
          PY

      - name: Create source issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          OBJECTIVE: ${{ inputs.objective }}
          PRIORITY: ${{ inputs.priority }}
        run: |
          cat > "$RUNNER_TEMP/body.md" <<EOF
          <!-- agent-root-task:v1 -->

          ## Objective

          $OBJECTIVE

          ## Priority

          $PRIORITY

          ## Mandatory workflow

          Codex product planning (API Luna)
          -> OpenAI Validator prototype/data/classification validation (API Luna)
          -> Account ChatGPT implementation (Chat 5.6 Sol High)
          -> Work GPT-6 code review / targeted repair
          -> OpenAI Validator QA/UIUX/classification acceptance
          -> Codex release review (API Luna)
          -> OpenAI Validator deployment gate
          -> automatic merge
          -> automatic production deployment
          -> health verification / rollback
          -> done.

          ## Safety

          - Use synthetic data unless the human owner explicitly authorizes real data.
          - Automatic merge/deployment is allowed only after every policy gate succeeds.
          - Stop immediately if AUTO_PRODUCTION_ENABLED is not true or EMERGENCY_STOP is true.
          - Preserve the stable task ID and all agent-handoff records.
          - Normal implementation must not dispatch the retired API Sol workflow.
          - Urgent/high-difficulty work may be escalated to the account Work GPT-6 path after its shadow gate is proven.
          EOF

          ISSUE_URL="$(gh issue create             --repo "${{ github.repository }}"             --title "$TITLE"             --body-file "$RUNNER_TEMP/body.md")"

          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      - name: Prepare task state
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --add-label "phase:product-plan"             --add-label "status:todo"

      - name: Dispatch to Codex
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --add-label "agent:codex"

          jq -n             --argjson issue_number "$ISSUE_NUMBER"             '{
              event_type:"agent_codex_product",
              client_payload:{issue_number:$issue_number}
            }' | gh api --method POST "repos/${{ github.repository }}/dispatches" --input -

      - name: Summary
        run: |
          {
            echo "## Agent task started"
            echo
            echo "- Issue: #${{ steps.issue.outputs.number }}"
            echo "- First owner: Codex"
            echo "- First phase: product-plan"
            echo "- Automatic chain ends at production deployment + health verification"
          } >> "$GITHUB_STEP_SUMMARY"
