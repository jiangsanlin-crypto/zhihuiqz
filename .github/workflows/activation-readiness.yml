name: Activation Readiness

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Activation stage to validate
        required: true
        type: choice
        options:
          - predeploy
          - postdeploy

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Validate repository automation policy
        run: |
          python scripts/check_model_policy.py
          python scripts/check_dispatch_policy.py
          python scripts/check_full_auto_policy.py

          python - <<'PY'
          import json
          policy=json.load(open("config/automation_policy.json"))
          if policy.get("auto_production_enabled") is not True:
              raise SystemExit("auto production is disabled")
          if policy.get("emergency_stop") is True:
              raise SystemExit("emergency stop is active")
          if policy.get("require_ci_check") != "test":
              raise SystemExit("required CI policy must be test")
          print("repository automation policy validated")
          PY

      - name: Resolve and verify OpenAI API key
        id: openai_key
        env:
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
          OPENAI_API_KEY_REPO: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/runtime_secret.py OPENAI_API_KEY             --fallback-env OPENAI_API_KEY_REPO             --output-name openai_api_key

          test -n "${{ steps.openai_key.outputs.openai_api_key }}"

      - name: Verify repository_dispatch with built-in GitHub token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '{"event_type":"activation_probe","client_payload":{"source":"activation-readiness"}}' |
            gh api --method POST "repos/${{ github.repository }}/dispatches" --input -
          echo "repository_dispatch capability verified"

      - name: Validate production server secrets
        if: inputs.stage == 'postdeploy'
        env:
          ORCH_SERVER_HOST: ${{ secrets.ORCH_SERVER_HOST }}
          ORCH_SERVER_USER: ${{ secrets.ORCH_SERVER_USER }}
          ORCH_SERVER_SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          ORCH_SERVER_KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in             ORCH_SERVER_HOST             ORCH_SERVER_USER             ORCH_SERVER_SSH_KEY             ORCH_SERVER_KNOWN_HOSTS
          do
            test -n "${!name:-}"
          done

      - name: Activation summary
        run: |
          {
            echo "## Activation readiness"
            echo
            echo "- Stage: ${{ inputs.stage }}"
            echo "- OpenAI API key: configured"
            echo "- repository_dispatch: working"
            echo "- WorkBuddy Cloud/OAuth: not required"
            echo "- Persistent Orchestrator: not required for agent routing"
          } >> "$GITHUB_STEP_SUMMARY"
