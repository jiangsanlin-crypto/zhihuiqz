name: Activation Readiness

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Activation stage to validate
        required: true
        type: choice
        options:
          - predeploy
          - postdeploy

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Validate repository policy
        run: |
          python scripts/check_model_policy.py
          python scripts/check_dispatch_policy.py
          python scripts/check_full_auto_policy.py

          python - <<'PY'
          import json
          policy=json.load(open("config/automation_policy.json"))
          if policy.get("auto_production_enabled") is not True:
              raise SystemExit("auto production is disabled")
          if policy.get("emergency_stop") is True:
              raise SystemExit("emergency stop is active")
          if policy.get("require_ci_check") != "test":
              raise SystemExit("required CI check must be test")
          print("repository automation policy validated")
          PY

      - name: Validate server/deployment secret presence
        env:
          ORCH_SERVER_HOST: ${{ secrets.ORCH_SERVER_HOST }}
          ORCH_SERVER_USER: ${{ secrets.ORCH_SERVER_USER }}
          ORCH_SERVER_SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          ORCH_SERVER_KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
        run: |
          set -euo pipefail
          for name in             ORCH_SERVER_HOST             ORCH_SERVER_USER             ORCH_SERVER_SSH_KEY             ORCH_SERVER_KNOWN_HOSTS             ORCH_ENV_B64
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required secret: $name"
              exit 1
            fi
          done

      - name: Validate protected runtime bundle
        env:
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
          OPENAI_API_KEY_REPO: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ORCH_ENV_B64" | base64 -d > "$RUNNER_TEMP/server.env"

          python - <<'PY'
          import os
          from pathlib import Path

          values={}
          for raw in Path(os.environ["RUNNER_TEMP"],"server.env").read_text().splitlines():
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key,value=line.split("=",1)
              values[key.strip()]=value.strip()

          required=[
              "GITHUB_TOKEN",
              "GITHUB_REPOSITORY",
              "ORCHESTRATOR_TOKEN",
              "WORKBUDDY_MODEL",
              "WORKBUDDY_MODEL_LOCK_CONFIRMED",
          ]
          missing=[key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("server env missing keys: " + ", ".join(missing))

          if values["GITHUB_REPOSITORY"] != "jiangsanlin-crypto/zhihuiqz":
              raise SystemExit("server repository binding is incorrect")

          if values["WORKBUDDY_MODEL"] != "GLM-5.3-Flash":
              raise SystemExit("WorkBuddy model is not GLM-5.3-Flash")

          if values["WORKBUDDY_MODEL_LOCK_CONFIRMED"].lower() not in {"1","true","yes","on"}:
              raise SystemExit("WorkBuddy model lock is not confirmed")

          oauth_ok=bool(values.get("WORKBUDDY_ACCESS_TOKEN")) or all(
              values.get(key)
              for key in (
                  "WORKBUDDY_CLIENT_ID",
                  "WORKBUDDY_CLIENT_SECRET",
                  "WORKBUDDY_REFRESH_TOKEN",
              )
          )
          print(
              "WorkBuddy mode: "
              + (
                  "full (real dispatch enabled)"
                  if oauth_ok
                  else "degraded (OAuth optional; real dispatch disabled)"
              )
          )

          openai_ok=bool(os.environ.get("OPENAI_API_KEY_REPO")) or bool(values.get("OPENAI_API_KEY"))
          if not openai_ok:
              raise SystemExit("OPENAI_API_KEY is missing from repository secrets and ORCH_ENV_B64")

          print("protected runtime bundle validated")
          PY

      - name: Verify repository_dispatch with built-in GitHub token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '{"event_type":"activation_probe","client_payload":{"source":"activation-readiness"}}' |
            gh api --method POST "repos/${{ github.repository }}/dispatches" --input -
          echo "repository_dispatch capability verified"

      - name: Verify live Orchestrator readiness
        if: inputs.stage == 'postdeploy'
        env:
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          ORCH_SERVER_HOST: ${{ secrets.ORCH_SERVER_HOST }}
        run: |
          URL="$ORCHESTRATOR_URL"
          if [ -z "$URL" ] && [ -n "$ORCH_SERVER_HOST" ]; then
            URL="http://$ORCH_SERVER_HOST:8080"
          fi
          test -n "$URL"

          curl --fail-with-body -sS "$URL/readyz" > "$RUNNER_TEMP/readyz.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ["RUNNER_TEMP"],"readyz.json").read_text())
          if data.get("ok") is not True:
              raise SystemExit("Orchestrator is not ready")
          for name,item in (data.get("checks") or {}).items():
              if not item.get("ok"):
                  raise SystemExit(f"readiness check failed: {name}")
          print("live Orchestrator readiness validated")
          PY

      - name: Activation summary
        run: |
          echo "Activation readiness passed for stage: ${{ inputs.stage }}" >> "$GITHUB_STEP_SUMMARY"
