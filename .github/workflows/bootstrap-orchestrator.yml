name: Deploy Automation Runtime

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-ORCHESTRATOR
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY-ORCHESTRATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          HOST: ${{ secrets.ORCH_SERVER_HOST }}
          USER: ${{ secrets.ORCH_SERVER_USER }}
          SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
          ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$ENV_B64"

      - name: Validate protected runtime bundle before touching server
        env:
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ORCH_ENV_B64" | base64 -d > "$RUNNER_TEMP/server.env"

          python - <<'PY'
          import os
          from pathlib import Path

          values={}
          for raw in Path(os.environ["RUNNER_TEMP"],"server.env").read_text().splitlines():
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key,value=line.split("=",1)
              values[key.strip()]=value.strip()

          required=[
              "GITHUB_TOKEN",
              "GITHUB_REPOSITORY",
              "ORCHESTRATOR_TOKEN",
          ]
          missing=[key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("server env missing keys: " + ", ".join(missing))

          if values["GITHUB_REPOSITORY"] != "jiangsanlin-crypto/zhihuiqz":
              raise SystemExit("server repository binding is incorrect")

          print("server runtime bundle validated")
          PY

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload protected environment
        env:
          HOST: ${{ secrets.ORCH_SERVER_HOST }}
          USER: ${{ secrets.ORCH_SERVER_USER }}
          PORT: ${{ secrets.ORCH_SERVER_PORT }}
          TARGET: ${{ secrets.ORCH_SERVER_PATH }}
          ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
        run: |
          PORT="${PORT:-22}"
          TARGET="${TARGET:-/opt/zhihuiqz-orchestrator}"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -p "$PORT" "$USER@$HOST" "mkdir -p '$TARGET' && chmod 700 '$TARGET'"
          printf '%s' "$ENV_B64" |
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -p "$PORT" "$USER@$HOST"             "base64 -d > '$TARGET/.env' && chmod 600 '$TARGET/.env'"

      - name: Deploy persistent Orchestrator
        env:
          HOST: ${{ secrets.ORCH_SERVER_HOST }}
          USER: ${{ secrets.ORCH_SERVER_USER }}
          PORT: ${{ secrets.ORCH_SERVER_PORT }}
          TARGET: ${{ secrets.ORCH_SERVER_PATH }}
        run: |
          PORT="${PORT:-22}"
          TARGET="${TARGET:-/opt/zhihuiqz-orchestrator}"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -p "$PORT" "$USER@$HOST" bash -s -- "$TARGET" <<'REMOTE'
          set -euo pipefail
          TARGET="$1"
          REPO="https://github.com/jiangsanlin-crypto/zhihuiqz.git"

          if [ ! -d "$TARGET/.git" ]; then
            git clone "$REPO" "$TARGET/repo.tmp"
            cp -a "$TARGET/repo.tmp/.git" "$TARGET/.git"
            rm -rf "$TARGET/repo.tmp"
          fi

          cd "$TARGET"
          PREV_SHA="$(git rev-parse HEAD 2>/dev/null || true)"

          git fetch origin main
          git reset --hard origin/main

          set +e
          docker compose up -d --build
          DEPLOY_RC=$?
          set -e

          if [ "$DEPLOY_RC" -ne 0 ]; then
            if [ -n "$PREV_SHA" ]; then
              git reset --hard "$PREV_SHA"
              docker compose up -d --build || true
            fi
            exit "$DEPLOY_RC"
          fi

          READY=0
          for delay in 0 5 10 20 30 45; do
            sleep "$delay"
            if curl --fail --silent http://127.0.0.1:8080/readyz >/tmp/readyz.json; then
              READY=1
              break
            fi
          done

          if [ "$READY" -ne 1 ]; then
            echo "Orchestrator readiness failed; rolling back."
            docker compose ps || true
            if [ -n "$PREV_SHA" ]; then
              git reset --hard "$PREV_SHA"
              docker compose up -d --build || true
            fi
            exit 1
          fi

          python - <<'PY'
          import json
          data=json.load(open("/tmp/readyz.json"))
          if data.get("ok") is not True:
              raise SystemExit("readyz returned ok != true")
          print("Orchestrator ready")
          PY

          docker compose ps
          REMOTE

      - name: Deployment summary
        run: |
          {
            echo "## Automation runtime deployed"
            echo
            echo "- Transport: GitHub Actions -> SSH -> Docker Compose"
            echo "- Readiness gate: /readyz"
            echo "- Rollback: previous Git SHA on failure"
            echo "- Agent handoffs run directly in GitHub Actions; this runtime is used for deployment health/audit only"
          } >> "$GITHUB_STEP_SUMMARY"
