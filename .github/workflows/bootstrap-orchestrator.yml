name: Deploy Shared Control Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-ORCHESTRATOR
        required: true

permissions:
  contents: read

concurrency:
  group: shared-control-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY-ORCHESTRATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          HOST: ${{ secrets.ORCH_SERVER_HOST }}
          USER: ${{ secrets.ORCH_SERVER_USER }}
          SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
          ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$ENV_B64"

      - name: Build protected controller environment
        env:
          ORCH_ENV_B64: ${{ secrets.ORCH_ENV_B64 }}
          CONTROL_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$ORCH_ENV_B64" | base64 -d > "$RUNNER_TEMP/server.env"

          python - <<'PY'
          import os
          from pathlib import Path

          path=Path(os.environ["RUNNER_TEMP"])/"server.env"
          lines=path.read_text().splitlines()
          values={}
          for raw in lines:
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key,value=line.split("=",1)
              values[key.strip()]=value.strip()

          required=["GITHUB_TOKEN","GITHUB_REPOSITORY","ORCHESTRATOR_TOKEN"]
          missing=[key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("server env missing keys: " + ", ".join(missing))
          if values["GITHUB_REPOSITORY"] != "jiangsanlin-crypto/zhihuiqz":
              raise SystemExit("server repository binding is incorrect")

          overrides={
              "CONTROL_REPOSITORY":"jiangsanlin-crypto/zhihuiqz",
              "CONTROL_BUILD_SHA":os.environ["CONTROL_BUILD_SHA"],
              "CONTROL_WRITES_ENABLED":"true",
              "CONTROL_STATE_DB":"/app/data/orchestrator.db",
          }
          kept=[
              raw for raw in lines
              if raw.split("=",1)[0].strip() not in overrides
          ]
          kept.extend(f"{key}={value}" for key,value in overrides.items())
          path.write_text("\n".join(kept)+"\n")
          print("protected controller environment validated")
          PY

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORCH_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORCH_SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload protected environment
        env:
          HOST: ${{ secrets.ORCH_SERVER_HOST }}
          USER: ${{ secrets.ORCH_SERVER_USER }}
          PORT: ${{ secrets.ORCH_SERVER_PORT }}
          TARGET: ${{ secrets.ORCH_SERVER_PATH }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          TARGET="${TARGET:-/opt/zhihuiqz-orchestrator}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -p "$PORT" "$USER@$HOST" "mkdir -p '$TARGET' && chmod 700 '$TARGET'"
          base64 < "$RUNNER_TEMP/server.env" |
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -p "$PORT" "$USER@$HOST" \
              "base64 -d > '$TARGET/.env' && chmod 600 '$TARGET/.env'"

      - name: Deploy exact main controller
        env:
          HOST: ${{ secrets.ORCH_SERVER_HOST }}
          USER: ${{ secrets.ORCH_SERVER_USER }}
          PORT: ${{ secrets.ORCH_SERVER_PORT }}
          TARGET: ${{ secrets.ORCH_SERVER_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          TARGET="${TARGET:-/opt/zhihuiqz-orchestrator}"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -p "$PORT" "$USER@$HOST" bash -s -- "$TARGET" "$EXPECTED_SHA" <<'REMOTE'
          set -euo pipefail
          TARGET="$1"
          EXPECTED_SHA="$2"
          REPO="https://github.com/jiangsanlin-crypto/zhihuiqz.git"

          if [ ! -d "$TARGET/.git" ]; then
            git clone "$REPO" "$TARGET/repo.tmp"
            cp -a "$TARGET/repo.tmp/.git" "$TARGET/.git"
            rm -rf "$TARGET/repo.tmp"
          fi

          cd "$TARGET"
          PREV_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          git fetch origin main
          git reset --hard "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

          set +e
          docker compose up -d --build
          DEPLOY_RC=$?
          set -e

          rollback() {
            echo "Rolling back shared controller"
            if [ -n "$PREV_SHA" ]; then
              git reset --hard "$PREV_SHA"
              sed -i 's/^CONTROL_WRITES_ENABLED=.*/CONTROL_WRITES_ENABLED=false/' .env || true
              docker compose up -d --build || true
            fi
          }

          if [ "$DEPLOY_RC" -ne 0 ]; then
            rollback
            exit "$DEPLOY_RC"
          fi

          READY=0
          for delay in 0 3 5 10 20 30; do
            sleep "$delay"
            if curl --fail --silent http://127.0.0.1:8080/readyz >/tmp/readyz.json; then
              READY=1
              break
            fi
          done

          if [ "$READY" -ne 1 ]; then
            docker compose ps || true
            rollback
            exit 1
          fi

          python - "$EXPECTED_SHA" <<'PY'
          import json,sys
          data=json.load(open("/tmp/readyz.json"))
          expected=sys.argv[1]
          assert data.get("status")=="ready"
          assert data.get("build_sha")==expected
          assert data.get("writes_enabled") is True
          assert data.get("agents_enabled") is False
          assert data.get("protocol")=="shared-claims:v1"
          assert data.get("repository")=="jiangsanlin-crypto/zhihuiqz"
          print("shared controller ready")
          PY
          docker compose ps
          REMOTE

      - name: Deployment summary
        run: |
          {
            echo "## Shared control runtime deployed"
            echo
            echo "- Revision: \`${{ github.sha }}\`"
            echo "- Transport: GitHub Actions -> SSH -> Docker Compose"
            echo "- Authority: shared claims/state writer"
            echo "- Readiness: exact build + writes enabled"
            echo "- Automatic rollback: enabled"
          } >> "$GITHUB_STEP_SUMMARY"
