services:
  khmerhire-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khmerhire}
      POSTGRES_USER: ${POSTGRES_USER:-khmerhire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - khmerhire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khmerhire} -d ${POSTGRES_DB:-khmerhire}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-khmerhire}:${POSTGRES_PASSWORD}@khmerhire-db:5432/${POSTGRES_DB:-khmerhire}
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-604800}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8088}
    depends_on:
      khmerhire-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${KHMERHIRE_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  khmerhire_pgdata:
