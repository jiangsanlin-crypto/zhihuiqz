services:
  orchestrator:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      - workbuddy-runner
      - sandbox-runner

  workbuddy-runner:
    build: .
    restart: unless-stopped
    command:
      - uvicorn
      - orchestrator.workbuddy_runner:app
      - --host
      - 0.0.0.0
      - --port
      - "8091"
    env_file:
      - .env
    environment:
      WORKBUDDY_RUNNER_TOKEN: ${WORKBUDDY_TOKEN}
    read_only: true
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  sandbox-runner:
    build: .
    restart: unless-stopped
    command:
      - uvicorn
      - orchestrator.sandbox_runner:app
      - --host
      - 0.0.0.0
      - --port
      - "8092"
    env_file:
      - .env
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_TOKEN}
    read_only: true
    tmpfs:
      - /tmp:size=512m,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
