services:
  orchestrator:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      - workbuddy-runner
      - sandbox-runner

  workbuddy-runner:
    build: .
    restart: unless-stopped
    command:
      - uvicorn
      - orchestrator.workbuddy_runner:app
      - --host
      - 0.0.0.0
      - --port
      - "8091"
    environment:
      WORKBUDDY_RUNNER_TOKEN: ${WORKBUDDY_TOKEN}
      WORKBUDDY_ALLOWED_REPO: ${WORKBUDDY_ALLOWED_REPO}
      WORKBUDDY_API_BASE: ${WORKBUDDY_API_BASE}
      WORKBUDDY_CLIENT_ID: ${WORKBUDDY_CLIENT_ID}
      WORKBUDDY_CLIENT_SECRET: ${WORKBUDDY_CLIENT_SECRET}
      WORKBUDDY_REFRESH_TOKEN: ${WORKBUDDY_REFRESH_TOKEN}
      WORKBUDDY_ACCESS_TOKEN: ${WORKBUDDY_ACCESS_TOKEN}
      WORKBUDDY_TOKEN_FILE: /app/data/workbuddy_oauth.json
      WORKBUDDY_TIMEOUT_SECONDS: ${WORKBUDDY_TIMEOUT_SECONDS}
      WORKBUDDY_POLL_SECONDS: ${WORKBUDDY_POLL_SECONDS}
    read_only: true
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  sandbox-runner:
    build: .
    restart: unless-stopped
    command:
      - uvicorn
      - orchestrator.sandbox_runner:app
      - --host
      - 0.0.0.0
      - --port
      - "8092"
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_TOKEN}
      SANDBOX_ALLOWED_REPO: ${SANDBOX_ALLOWED_REPO}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS}
      SANDBOX_WORK_ROOT: /tmp/sandbox-work
    read_only: true
    tmpfs:
      - /tmp:size=512m,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
