services:
  orchestrator:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      workbuddy-runner:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  workbuddy-runner:
    build: .
    restart: unless-stopped
    command:
      - uvicorn
      - orchestrator.workbuddy_runner:app
      - --host
      - 0.0.0.0
      - --port
      - "8091"
    environment:
      WORKBUDDY_RUNNER_TOKEN: ${WORKBUDDY_TOKEN}
      WORKBUDDY_ALLOWED_REPO: ${WORKBUDDY_ALLOWED_REPO}
      WORKBUDDY_API_BASE: ${WORKBUDDY_API_BASE}
      WORKBUDDY_CLIENT_ID: ${WORKBUDDY_CLIENT_ID}
      WORKBUDDY_CLIENT_SECRET: ${WORKBUDDY_CLIENT_SECRET}
      WORKBUDDY_REFRESH_TOKEN: ${WORKBUDDY_REFRESH_TOKEN}
      WORKBUDDY_ACCESS_TOKEN: ${WORKBUDDY_ACCESS_TOKEN}
      WORKBUDDY_TOKEN_FILE: /app/data/workbuddy_oauth.json
      WORKBUDDY_TIMEOUT_SECONDS: ${WORKBUDDY_TIMEOUT_SECONDS}
      WORKBUDDY_POLL_SECONDS: ${WORKBUDDY_POLL_SECONDS}
      WORKBUDDY_MODEL: ${WORKBUDDY_MODEL}
      WORKBUDDY_MODEL_LOCK_CONFIRMED: ${WORKBUDDY_MODEL_LOCK_CONFIRMED}
    read_only: true
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp:size=512m,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
